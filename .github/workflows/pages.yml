# Publica el sitio tal cual, sin Jekyll.
#
# El constructor heredado de Pages falla —«Page build failed», sin más detalle—
# incluso con un `.nojekyll` en la raíz cuando hay directorios con espacio en el
# nombre, y aquí hay dos: `Material html` y la propia raíz del curso. Este flujo
# sube los archivos como artefacto estático y los despliega sin procesarlos, y
# no tiene ese problema. Viene probado del repositorio de Lógica de Programación.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
