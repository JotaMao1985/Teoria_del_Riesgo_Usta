<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Plantilla base y catálogo de componentes del material de Teoría del Riesgo. Universidad Santo Tomás.">
    <title>Teoría del Riesgo — Plantilla base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

    <!-- Prism.js — resaltado de sintaxis con gramáticas oficiales.
         `Prism.manual = true` DEBE ir antes de cargar el núcleo: si no, Prism
         recorre el documento al cargar y aquí el contenido lo pinta React
         después, de modo que ese recorrido solo gasta tiempo.
         Este curso usa dos lenguajes, Python y R, y Prism trae gramática
         oficial de los dos: no hace falta registrar ninguna a mano. -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-r.min.js"></script>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3D008D',
                        secondary: '#ED1E79',
                        navy: '#001A4D',
                        gold: '#FDB913',
                        teal: '#0E7490',
                        bg: '#F8FAFC',
                        surface: '#FFFFFF',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F8FAFC;
            color: #1E293B;
            scroll-behavior: smooth;
        }

        code,
        pre {
            font-family: 'Fira Code', monospace;
        }

        .tr-gradient {
            background: linear-gradient(140deg, #3D008D 0%, #ED1E79 100%);
        }

        .tr-header {
            background: linear-gradient(180deg, #001A4D 0%, #002868 100%);
        }

        .tr-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .tr-card:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3D008D, #ED1E79);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #4A00A8, #FF2D8A);
        }

        .code-scroll::-webkit-scrollbar {
            height: 8px;
        }

        .code-scroll::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        .code-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3D008D, #ED1E79);
            border-radius: 4px;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #ED1E79;
            outline-offset: 2px;
        }

        .inline-code {
            background: #F1F5F9;
            color: #0F172A;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: 'Fira Code', monospace;
        }

        .chart-h-320 {
            height: 320px;
        }

        .chart-h-360 {
            height: 360px;
        }

        .chart-h-400 {
            height: 400px;
        }

        .chart-h-420 {
            height: 420px;
        }

        .prose-tr p {
            margin-bottom: 1rem;
            line-height: 1.75;
        }

        .prose-tr h3 {
            color: #ED1E79;
            font-weight: 600;
            font-size: 1.2rem;
            margin: 1.8rem 0 0.6rem;
        }

        .prose-tr h4 {
            color: #001A4D;
            font-weight: 600;
            font-size: 1.05rem;
            margin: 1.4rem 0 0.4rem;
        }

        .prose-tr ul {
            list-style: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose-tr ol {
            list-style: decimal;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose-tr li {
            margin-bottom: 0.35rem;
            line-height: 1.65;
        }

        .prose-tr strong {
            color: #0F172A;
        }

        /* Las tablas escritas a mano en la prosa de un capítulo reciben este
           estilo por omisión. Las de los COMPONENTES no: llevan la clase
           `tabla-componente` y se excluyen aquí. Sin esa exclusión, la regla
           de `th` pintaría de lila claro la cabecera navy de
           `TablaResultados`, cuyo texto es blanco — y el resultado sería
           blanco sobre casi blanco, ilegible y sin ningún error visible. */
        .prose-tr table:not(.tabla-componente) {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin: 1rem 0;
        }

        .prose-tr table:not(.tabla-componente) th {
            background: #F5F0FA;
            color: #001A4D;
            text-align: left;
            padding: 0.6rem 0.8rem;
            border: 1px solid #E2E8F0;
        }

        .prose-tr table:not(.tabla-componente) td {
            padding: 0.6rem 0.8rem;
            border: 1px solid #E2E8F0;
            vertical-align: top;
        }

        .eq-block {
            background: #FAF8FF;
            border: 1px solid rgba(61, 0, 141, 0.12);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            overflow-x: auto;
        }

        .tr-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: #EADCF8;
            outline: none;
        }

        .tr-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ED1E79;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
            cursor: pointer;
        }

        mjx-container svg {
            display: inline-block;
        }

        /* ============================================================
           BLOQUES DE CÓDIGO — patrón tomado del material de Diseño de
           Experimentos (cap. 1, «El diseño, escrito en código»).
        ============================================================ */
        .tr-code-wrapper {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.12);
        }

        /* La pestaña activa se apoya sobre el bloque: sin esquina superior
           izquierda, para que se lea como una carpeta y no como dos cajas. */
        .tr-code-wrapper.con-pestanas {
            border-top-left-radius: 0;
        }

        .tr-code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            border-bottom: 1px solid #334155;
        }

        .tr-code-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tr-code-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #CBD5E1;
            padding: 0.35rem 0.7rem;
            border-radius: 0.375rem;
            font-size: 0.72rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .tr-code-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .tr-code-btn.copiado {
            background: rgba(34, 197, 94, 0.3);
            color: #4ADE80;
        }

        .tr-code-pre {
            background: #1E293B;
            color: #F3F4F6;
            padding: 1.5rem;
            margin: 0;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            line-height: 1.625;
            max-height: 30rem;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }

        .tr-code-pre.plegado {
            max-height: 9.5rem;
            overflow: hidden;
        }

        .tr-code-pre.plegado::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3.75rem;
            background: linear-gradient(transparent, #1E293B);
            pointer-events: none;
        }

        /* Pestañas de lenguaje, en forma de carpeta. */
        .tr-tab {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.45rem 1.1rem;
            border-radius: 0.5rem 0.5rem 0 0;
            background: #E2E8F0;
            color: #64748B;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tr-tab:hover {
            background: #CBD5E1;
            color: #0F172A;
        }

        .tr-tab.activa {
            background: linear-gradient(135deg, #3D008D 0%, #ED1E79 100%);
            color: #fff;
        }

        /* Líneas de SALIDA dentro del bloque (`//>`, `#>`, `'>`).
           Prism las tokeniza como comentario; aquí se les da color propio
           para distinguir lo que escribió el docente de lo que respondió
           la máquina. */
        .tr-salida,
        .tr-salida .token {
            color: #7DD3FC !important;
            font-style: normal !important;
        }

        .tr-salida {
            display: inline-block;
            width: 100%;
            background: rgba(125, 211, 252, 0.07);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        /* === TR-CORE INICIO — no editar a mano: se genera con ensamblar.py === */
        const { useState, useEffect, useRef } = React;

        const typesetMath = (retries = 25) => {
            if (window.MathJax && window.MathJax.typesetPromise) {
                try { window.MathJax.typesetClear && window.MathJax.typesetClear(); } catch (e) { }
                window.MathJax.typesetPromise().catch(() => { });
            } else if (retries > 0) {
                setTimeout(() => typesetMath(retries - 1), 200);
            }
        };

        const useTypeset = (ref, deps) => {
            useEffect(() => {
                const t = setTimeout(() => {
                    if (ref.current && window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([ref.current]).catch(() => { });
                    }
                }, 40);
                return () => clearTimeout(t);
            }, deps);
        };

        /* ============================================================
           ICONOS SVG
        ============================================================ */
        const Icons = {
            BookOpen: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
            ),
            Binary: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="2" y="2" width="20" height="20" rx="2" />
                    <line x1="6" y1="7" x2="10" y2="7" /><line x1="8" y1="5" x2="8" y2="9" />
                    <line x1="14" y1="7" x2="18" y2="7" />
                    <line x1="6" y1="13" x2="10" y2="13" /><line x1="6" y1="17" x2="10" y2="17" /><line x1="14" y1="17" x2="18" y2="17" />
                    <line x1="14" y1="13" x2="18" y2="13" /><line x1="16" y1="11" x2="16" y2="15" />
                </svg>
            ),
            Cpu: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <rect x="9" y="9" width="6" height="6" />
                    <path d="M9 2v2" /><path d="M15 2v2" /><path d="M9 20v2" /><path d="M15 20v2" />
                    <path d="M2 9h2" /><path d="M2 15h2" /><path d="M20 9h2" /><path d="M20 15h2" />
                </svg>
            ),
            Calculator: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="4" y="2" width="16" height="20" rx="2" />
                    <line x1="8" y1="6" x2="16" y2="6" /><line x1="8" y1="10" x2="8" y2="14" />
                    <line x1="12" y1="10" x2="12" y2="14" /><line x1="16" y1="10" x2="16" y2="14" />
                    <line x1="8" y1="18" x2="16" y2="18" />
                </svg>
            ),
            Award: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="8" r="7"></circle>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                </svg>
            ),
            /* Los diez de abajo son los que usan las barras laterales de los
               capítulos. `renderIcon` y `SectionHeader` toleran un nombre que
               no existe —devuelven null y no rompen la página—, así que un
               icono mal escrito no produce ningún error: deja un hueco. Este
               bloque existe para que la lista cubra los quince capítulos y el
               hueco no sea la opción por defecto. */
            HelpCircle: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
            ),
            TrendingUp: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                    <polyline points="17 6 23 6 23 12" />
                </svg>
            ),
            BarChart: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <line x1="12" y1="20" x2="12" y2="10" />
                    <line x1="18" y1="20" x2="18" y2="4" />
                    <line x1="6" y1="20" x2="6" y2="16" />
                </svg>
            ),
            Activity: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </svg>
            ),
            Layers: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polygon points="12 2 2 7 12 12 22 7 12 2" />
                    <polyline points="2 17 12 22 22 17" />
                    <polyline points="2 12 12 17 22 12" />
                </svg>
            ),
            Table: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="3" y1="9" x2="21" y2="9" />
                    <line x1="3" y1="15" x2="21" y2="15" />
                    <line x1="9" y1="9" x2="9" y2="21" />
                </svg>
            ),
            Clock: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
            ),
            Bug: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="8" y="6" width="8" height="14" rx="4" />
                    <path d="M9 6a3 3 0 0 1 6 0" />
                    <line x1="2" y1="11" x2="8" y2="11" /><line x1="16" y1="11" x2="22" y2="11" />
                    <line x1="3" y1="17" x2="8" y2="15" /><line x1="16" y1="15" x2="21" y2="17" />
                    <line x1="3" y1="6" x2="8" y2="8" /><line x1="16" y1="8" x2="21" y2="6" />
                </svg>
            ),
            Scale: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <line x1="12" y1="3" x2="12" y2="21" />
                    <line x1="6" y1="6" x2="18" y2="6" />
                    <path d="M6 6 2 14a4 4 0 0 0 8 0z" />
                    <path d="M18 6l-4 8a4 4 0 0 0 8 0z" />
                </svg>
            ),
            Sliders: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <line x1="4" y1="21" x2="4" y2="14" /><line x1="4" y1="10" x2="4" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="12" /><line x1="12" y1="8" x2="12" y2="3" />
                    <line x1="20" y1="21" x2="20" y2="16" /><line x1="20" y1="12" x2="20" y2="3" />
                    <line x1="1" y1="14" x2="7" y2="14" /><line x1="9" y1="8" x2="15" y2="8" /><line x1="17" y1="16" x2="23" y2="16" />
                </svg>
            ),
            ChevronLeft: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            ),
            ChevronRight: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            ),
        };

        const renderIcon = (iconName, size = 20) => {
            const Icon = Icons[iconName];
            return Icon ? <Icon size={size} /> : null;
        };
        const Box = ({ type = 'info', label, children }) => {
            const styles = {
                info: { border: '#3D008D', bg: '#F5F0FA', label: '#3D008D', icon: 'fa-circle-info' },
                tip: { border: '#15803D', bg: '#F0FDF4', label: '#15803D', icon: 'fa-lightbulb' },
                warn: { border: '#B45309', bg: '#FFFBEB', label: '#B45309', icon: 'fa-triangle-exclamation' },
                danger: { border: '#B91C1C', bg: '#FEF2F2', label: '#B91C1C', icon: 'fa-circle-exclamation' },
            }[type] || { border: '#3D008D', bg: '#F5F0FA', label: '#3D008D', icon: 'fa-circle-info' };
            return (
                <div className="rounded-xl px-5 py-4 my-4 border-l-4" style={{ borderColor: styles.border, background: styles.bg }}>
                    {label && (
                        <span className="inline-flex items-center gap-2 text-[0.7rem] uppercase tracking-wider font-bold rounded mb-2 px-2 py-0.5 text-white" style={{ background: styles.label }}>
                            <i className={`fas ${styles.icon}`}></i>{label}
                        </span>
                    )}
                    <div className="text-gray-700 leading-relaxed text-[0.95rem]">{children}</div>
                </div>
            );
        };

        const CalloutPro = ({ tema = 'info', titulo, subtitulo, icon, children }) => {
            const temas = {
                info: { grad: 'linear-gradient(135deg,#3D008D 0%,#0E7490 100%)', bg: 'rgba(61,0,141,0.05)', border: 'rgba(61,0,141,0.18)', icon: 'fa-circle-info' },
                warn: { grad: 'linear-gradient(135deg,#B45309 0%,#F59E0B 100%)', bg: 'rgba(180,83,9,0.06)', border: 'rgba(180,83,9,0.22)', icon: 'fa-triangle-exclamation' },
                gold: { grad: 'linear-gradient(135deg,#ED1E79 0%,#FF2D8A 100%)', bg: 'rgba(240,165,0,0.06)', border: 'rgba(240,165,0,0.22)', icon: 'fa-coins' },
            };
            const t = temas[tema] || temas.info;
            return (
                <div className="my-6 rounded-2xl overflow-hidden shadow-md border bg-white not-prose" style={{ borderColor: t.border }}>
                    <div className="px-5 py-3 flex items-center gap-3" style={{ background: t.grad }}>
                        <span className="bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0" style={{ width: 36, height: 36 }}>
                            <i className={`fas ${icon || t.icon} text-white text-lg`}></i>
                        </span>
                        <div>
                            <div className="text-white font-bold text-base leading-tight">{titulo}</div>
                            {subtitulo && <div className="text-white/80 text-xs">{subtitulo}</div>}
                        </div>
                    </div>
                    <div className="px-5 py-4 text-[0.95rem] text-gray-700 leading-relaxed" style={{ background: t.bg }}>
                        {children}
                    </div>
                </div>
            );
        };

        const Eq = ({ children }) => (
            <div className="eq-block my-4 text-center">{children}</div>
        );

        const SectionHeader = ({ title, icon: Icon }) => (
            <div className="flex items-center gap-3 mb-5 border-b border-gray-200 pb-3">
                <div className="tr-gradient p-2.5 rounded-xl shadow-md text-white">
                    {Icon && <Icon size={24} />}
                </div>
                <h2 className="text-2xl font-bold text-gray-900">{title}</h2>
            </div>
        );

        const Pipeline = ({ steps }) => (
            <div className="flex items-stretch flex-wrap gap-2 my-6 justify-between">
                {steps.map((s, i) => (
                    <React.Fragment key={i}>
                        <div className="flex-1 min-w-[140px] bg-white border border-gray-200 rounded-xl px-3 py-3 text-center text-sm shadow-sm" style={{ borderTop: '4px solid #3D008D' }}>
                            <span className="inline-block w-6 h-6 leading-6 rounded-full text-white font-bold text-xs mb-1" style={{ background: '#3D008D' }}>{s.num}</span>
                            <span className="block font-semibold text-navy mb-1">{s.title}</span>
                            <span className="text-gray-600">{s.desc}</span>
                        </div>
                        {i < steps.length - 1 && <div className="self-center text-secondary font-bold text-xl hidden md:block">→</div>}
                    </React.Fragment>
                ))}
            </div>
        );

        const Tabs = ({ tabs }) => {
            const [active, setActive] = useState(0);
            const contentRef = useRef(null);
            useTypeset(contentRef, [active]);
            return (
                <div className="my-5">
                    <div className="flex flex-wrap gap-1 border-b border-gray-200">
                        {tabs.map((t, i) => (
                            <button key={i} onClick={() => setActive(i)}
                                className={`px-4 py-2 text-sm font-semibold rounded-t-lg transition-colors ${active === i ? 'text-primary border-b-2 border-secondary bg-white' : 'text-gray-500 hover:text-primary'}`}>
                                {t.label}
                            </button>
                        ))}
                    </div>
                    <div ref={contentRef} className="p-4 bg-white border border-t-0 border-gray-200 rounded-b-lg animate-fade-in text-[0.95rem] text-gray-700">
                        <div key={active}>{tabs[active].content}</div>
                    </div>
                </div>
            );
        };

        const Accordion = ({ items }) => {
            const [open, setOpen] = useState(null);
            const ref = useRef(null);
            useTypeset(ref, [open]);
            return (
                <div ref={ref} className="space-y-2 my-5">
                    {items.map((it, i) => (
                        <div key={i} className="border border-gray-200 rounded-xl overflow-hidden bg-white">
                            <button onClick={() => setOpen(open === i ? null : i)}
                                className="w-full flex justify-between items-center px-4 py-3 hover:bg-gray-50 text-left font-semibold text-navy transition-colors">
                                <span>{it.titulo}</span>
                                <i className={`fas fa-chevron-down transition-transform duration-300 text-secondary ${open === i ? 'rotate-180' : ''}`}></i>
                            </button>
                            {open === i && (
                                <div className="px-4 py-3 bg-gray-50 text-gray-700 text-[0.92rem] leading-relaxed animate-fade-in border-t border-gray-100">
                                    {it.contenido}
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        const Reto = ({ titulo = 'Reto práctico', children, solucion }) => {
            const [show, setShow] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [show]);
            return (
                <div ref={ref} className="my-5 rounded-xl border-2 border-dashed p-5" style={{ borderColor: '#ED1E79', background: '#FFFDF5' }}>
                    <div className="flex items-center gap-2 font-bold text-navy mb-2">
                        <i className="fas fa-dumbbell text-gold"></i>{titulo}
                    </div>
                    <div className="text-gray-700 text-[0.95rem] mb-3">{children}</div>
                    {/* El botón solo existe si hay solución que mostrar. Sin esta
                        guarda —y `solucion` es opcional— el botón se pintaba
                        igual, cambiaba a «Ocultar solución» y no aparecía nada:
                        los seis R7 de la unidad 1 no la traen y los seis abrían
                        un panel vacío. Es el mismo defecto que el `MCQ` ya
                        cerraba con su «Explicación:» vacía. */}
                    {solucion && (
                        <button onClick={() => setShow(s => !s)}
                            className="text-xs font-bold px-3 py-1.5 rounded-full text-white tr-gradient hover:opacity-90 transition-opacity">
                            <i className={`fas ${show ? 'fa-eye-slash' : 'fa-key'} mr-1`}></i>
                            {show ? 'Ocultar solución' : 'Mostrar solución'}
                        </button>
                    )}
                    {show && solucion && <div className="mt-3 animate-fade-in">{solucion}</div>}
                </div>
            );
        };

        /* ============================================================
           BARAJADO DE OPCIONES — MCQ y Quiz
           Un cuestionario cuya respuesta correcta cae siempre en el
           mismo lugar se responde sin leerlo. Barajar aquí, y no
           repartiendo las opciones a mano en cada capítulo, deja el
           problema cerrado para los quince.

           El orden es DETERMINISTA, como el de `OrdenaPasos`: sale de
           un hash del enunciado y NO de Math.random(). Con azar por
           carga el orden salta al recargar y el docente no puede
           decir «la opción b» en clase; con el hash, cada pregunta
           tiene su orden propio y siempre el mismo.

           `correcta` y `justificacion` viajan dentro del objeto de la
           opción, así que permutar el arreglo no toca la calificación.

           Escape: `barajar={false}` en el MCQ, o `barajar: false` en
           una pregunta del Quiz, para las pocas opciones que tienen
           orden propio —una escala creciente, una cronología—.
        ============================================================ */
        const textoPlano = (n) => {
            if (n === null || n === undefined || typeof n === 'boolean') return '';
            if (typeof n === 'string' || typeof n === 'number') return String(n);
            if (Array.isArray(n)) return n.map(textoPlano).join('');
            if (n.props) return textoPlano(n.props.children);
            return '';
        };

        const hashTexto = (s) => {
            // FNV-1a de 32 bits. No necesita ser criptográfico: basta con
            // que la misma pregunta dé siempre lo mismo y dos preguntas
            // distintas casi nunca coincidan.
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
        };

        const barajarOpciones = (opciones, enunciado) => {
            if (!Array.isArray(opciones) || opciones.length < 2) return opciones;
            // Si el enunciado no deja texto —un nodo JSX sin cadenas—, se
            // siembra con los textos de las opciones: cualquier cosa antes
            // que sembrar todas las preguntas con la misma semilla.
            const semilla = textoPlano(enunciado) ||
                opciones.map(o => textoPlano(o.texto)).join('|');
            let s = hashTexto(semilla) || 1;
            const siguiente = () => {
                s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
                return s / 4294967296;
            };
            const out = opciones.slice();
            for (let i = out.length - 1; i > 0; i--) {
                const j = Math.floor(siguiente() * (i + 1));
                [out[i], out[j]] = [out[j], out[i]];
            }
            return out;
        };

        const MCQ = ({ pregunta, opciones, multiple = false, barajar = true }) => {
            const [sel, setSel] = useState([]);
            const [checked, setChecked] = useState(false);

            // Se recalcula en cada render y no pasa nada: es determinista,
            // así que los índices que guarda `sel` siguen apuntando a la
            // misma opción.
            const ops = barajar ? barajarOpciones(opciones, pregunta) : opciones;

            const toggle = (i) => {
                if (checked) return;
                if (multiple) setSel(s => s.includes(i) ? s.filter(x => x !== i) : [...s, i]);
                else setSel([i]);
            };

            const correctSet = ops.map((o, i) => o.correcta ? i : -1).filter(i => i >= 0);
            const acierto = sel.length === correctSet.length && sel.every(i => ops[i].correcta);
            const explicacion = ops.filter(o => o.correcta)
                .map(o => o.justificacion).filter(Boolean).join(' ');
            const ref = useRef(null);
            useTypeset(ref, [checked]);

            return (
                <div ref={ref} className="my-5 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
                    <div className="flex items-start gap-2 font-semibold text-navy mb-1">
                        <i className="fas fa-circle-question text-secondary mt-1"></i>
                        <span>{pregunta}</span>
                    </div>
                    {multiple && <p className="text-xs text-gray-400 mb-2 ml-6">Selección múltiple</p>}
                    <div className="space-y-2 mt-3">
                        {ops.map((o, i) => {
                            const isSel = sel.includes(i);
                            let cls = 'border-gray-200 hover:border-primary/50';
                            if (checked) {
                                if (o.correcta) cls = 'border-green-500 bg-green-50';
                                else if (isSel) cls = 'border-red-400 bg-red-50';
                                else cls = 'border-gray-200 opacity-70';
                            } else if (isSel) cls = 'border-secondary bg-amber-50';
                            return (
                                <button key={i} onClick={() => toggle(i)} disabled={checked}
                                    className={`w-full text-left px-4 py-2.5 rounded-lg border text-[0.92rem] flex items-center gap-3 transition-all ${cls}`}>
                                    <span className={`flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${isSel ? 'tr-gradient text-white' : 'bg-gray-100 text-gray-500'}`}>
                                        {String.fromCharCode(97 + i)}
                                    </span>
                                    <span className="flex-1 text-gray-700">{o.texto}</span>
                                    {checked && o.correcta && <i className="fas fa-check text-green-600"></i>}
                                    {checked && isSel && !o.correcta && <i className="fas fa-xmark text-red-500"></i>}
                                </button>
                            );
                        })}
                    </div>
                    <div className="mt-3 flex items-center gap-3">
                        {!checked
                            ? <button onClick={() => sel.length && setChecked(true)} disabled={!sel.length}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white tr-gradient disabled:opacity-40">Comprobar</button>
                            : <button onClick={() => { setChecked(false); setSel([]); }}
                                className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">Reintentar</button>}
                        {checked && (
                            <span className={`text-sm font-bold ${acierto ? 'text-green-600' : 'text-red-500'}`}>
                                <i className={`fas ${acierto ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                {acierto ? '¡Correcto!' : 'Revisa la explicación'}
                            </span>
                        )}
                    </div>
                    {/* La explicación solo aparece si hay algo que explicar.
                        Sin esta guarda —y `justificacion` es opcional— el
                        recuadro salía con el rótulo «Explicación:» en negrita y
                        nada detrás: los cinco primeros capítulos no la usan y
                        los cinco lo mostraban vacío. El Quiz ya se guardaba así. */}
                    {checked && explicacion && (
                        <div className="mt-3 text-[0.9rem] text-gray-700 bg-bg rounded-lg p-3 border-l-4 animate-fade-in" style={{ borderColor: '#ED1E79' }}>
                            <strong>Explicación: </strong>{explicacion}
                        </div>
                    )}
                </div>
            );
        };

        const Quiz = ({ titulo = 'Mini-cuestionario', preguntas }) => {
            const [resp, setResp] = useState({});
            const [enviado, setEnviado] = useState(false);

            // Mismo barajado estable que el MCQ, pregunta por pregunta. A
            // partir de aquí se trabaja con `qs`: mezclar las dos listas
            // calificaría contra el orden que el estudiante no ve.
            const qs = preguntas.map(q => (q.barajar === false)
                ? q
                : { ...q, opciones: barajarOpciones(q.opciones, q.pregunta) });

            const toggle = (qi, oi, multiple) => {
                if (enviado) return;
                setResp(prev => {
                    const actual = prev[qi] || [];
                    if (multiple) {
                        return { ...prev, [qi]: actual.includes(oi) ? actual.filter(x => x !== oi) : [...actual, oi] };
                    }
                    return { ...prev, [qi]: [oi] };
                });
            };

            const esCorrecta = (qi) => {
                const correctSet = qs[qi].opciones.map((o, i) => o.correcta ? i : -1).filter(i => i >= 0);
                const sel = resp[qi] || [];
                return sel.length === correctSet.length && sel.every(i => qs[qi].opciones[i].correcta);
            };

            const score = qs.reduce((acc, _, qi) => acc + (esCorrecta(qi) ? 1 : 0), 0);
            const total = qs.length;
            const pct = Math.round((score / total) * 100);
            const todasResp = qs.every((_, qi) => (resp[qi] || []).length > 0);

            const color = pct >= 80 ? '#15803D' : pct >= 50 ? '#B45309' : '#B91C1C';
            const mensaje = pct >= 80 ? '¡Excelente dominio del tema!' : pct >= 50 ? 'Bien, repasa los puntos fallados.' : 'Conviene releer la lección antes de continuar.';
            const ref = useRef(null);
            useTypeset(ref, [enviado]);

            return (
                <div ref={ref} className="my-8 rounded-2xl border border-primary/20 bg-white p-6 shadow-md">
                    <div className="flex items-center gap-2 mb-4">
                        <span className="tr-gradient text-white p-2 rounded-lg"><i className="fas fa-clipboard-question"></i></span>
                        <h3 className="text-lg font-bold text-primary" style={{ margin: 0 }}>{titulo}</h3>
                    </div>

                    {qs.map((q, qi) => (
                        <div key={qi} className="mb-5">
                            <div className="font-semibold text-navy text-[0.95rem] mb-2">
                                {qi + 1}. {q.pregunta}
                                {q.multiple && <span className="ml-2 text-xs text-gray-400 font-normal">(selección múltiple)</span>}
                            </div>
                            <div className="space-y-1.5">
                                {q.opciones.map((o, oi) => {
                                    const sel = (resp[qi] || []).includes(oi);
                                    let cls = 'border-gray-200 hover:border-primary/40';
                                    if (enviado) {
                                        if (o.correcta) cls = 'border-green-500 bg-green-50';
                                        else if (sel) cls = 'border-red-400 bg-red-50';
                                        else cls = 'border-gray-200 opacity-70';
                                    } else if (sel) cls = 'border-secondary bg-amber-50';
                                    return (
                                        <button key={oi} onClick={() => toggle(qi, oi, q.multiple)} disabled={enviado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.9rem] flex items-center gap-2.5 transition-all ${cls}`}>
                                            <span className={`flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-[0.7rem] font-bold ${sel ? 'tr-gradient text-white' : 'bg-gray-100 text-gray-500'}`}>
                                                {String.fromCharCode(97 + oi)}
                                            </span>
                                            <span className="flex-1 text-gray-700">{o.texto}</span>
                                            {enviado && o.correcta && <i className="fas fa-check text-green-600 text-xs"></i>}
                                            {enviado && sel && !o.correcta && <i className="fas fa-xmark text-red-500 text-xs"></i>}
                                        </button>
                                    );
                                })}
                            </div>
                            {enviado && q.justificacion && (
                                <p className="text-xs text-gray-600 mt-1.5 ml-1 italic">{q.justificacion}</p>
                            )}
                        </div>
                    ))}

                    {!enviado
                        ? <button onClick={() => todasResp && setEnviado(true)} disabled={!todasResp}
                            className="text-sm font-bold px-5 py-2 rounded-full text-white tr-gradient disabled:opacity-40">
                            <i className="fas fa-flag-checkered mr-2"></i>Calificar ({Object.keys(resp).length}/{total})
                        </button>
                        : (
                            <div className="animate-fade-in">
                                <div className="flex items-center gap-4 p-4 rounded-xl" style={{ background: '#FAFAFA' }}>
                                    <div className="relative w-20 h-20 flex-shrink-0">
                                        <svg viewBox="0 0 36 36" className="w-20 h-20">
                                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#eee" strokeWidth="3" />
                                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke={color} strokeWidth="3" strokeDasharray={`${pct}, 100`} strokeLinecap="round" />
                                        </svg>
                                        <span className="absolute inset-0 flex items-center justify-center font-extrabold text-sm" style={{ color }}>{pct}%</span>
                                    </div>
                                    <div>
                                        <div className="font-bold text-navy">Puntaje: {score} / {total}</div>
                                        <div className="text-sm" style={{ color }}>{mensaje}</div>
                                    </div>
                                </div>
                                <button onClick={() => { setEnviado(false); setResp({}); }}
                                    className="mt-3 text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                            </div>
                        )}
                </div>
            );
        };

        const usePlotly = (id, dataFn, layoutFn, deps = []) => {
            useEffect(() => {
                const el = document.getElementById(id);
                if (el && window.Plotly) {
                    window.Plotly.newPlot(id, dataFn(), layoutFn(), { responsive: true, displayModeBar: false });
                }
                return () => { if (window.Plotly) { try { window.Plotly.purge(id); } catch (e) { } } };
            }, deps);
        };

        /* El contenedor se OBSERVA, no solo se dibuja una vez.
           Plotly fija el ancho de la figura en el momento de crearla, y ese
           ancho cambia después: al abrirse la barra lateral, al aparecer la
           barra de desplazamiento cuando el contenido crece, al girar un
           teléfono. El `responsive: true` de Plotly solo escucha el `resize`
           de la VENTANA, así que en esos tres casos la figura queda más ancha
           que su tarjeta y se sale por la derecha — sin ningún error en
           consola, que es lo que hace que llegue al aula. */
        const ChartFrame = ({ id, height = 'chart-h-360', caption }) => {
            const caja = useRef(null);
            useEffect(() => {
                const el = caja.current;
                if (!el || typeof ResizeObserver === 'undefined') return;
                let pendiente = null;
                const obs = new ResizeObserver(() => {
                    if (pendiente) cancelAnimationFrame(pendiente);
                    // En el siguiente cuadro: durante el propio callback el
                    // navegador aún no ha terminado el reflujo, y medir ahí
                    // devuelve el ancho anterior.
                    pendiente = requestAnimationFrame(() => {
                        if (window.Plotly && el.querySelector('.main-svg')) {
                            try { window.Plotly.Plots.resize(el); } catch (e) { }
                        }
                    });
                });
                obs.observe(el);
                return () => { if (pendiente) cancelAnimationFrame(pendiente); obs.disconnect(); };
            }, [id]);
            return (
                <>
                    <div className="bg-white border border-gray-200 rounded-xl p-2 shadow-sm my-3">
                        <div ref={caja} id={id} className={height} style={{ width: '100%' }}></div>
                    </div>
                    {caption && <p className="text-xs text-gray-500 italic text-center mb-4">{caption}</p>}
                </>
            );
        };

        const Termino = ({ children, def }) => {
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState(null);
            const btnRef = useRef(null);
            const popRef = useRef(null);
            const closeTimer = useRef(null);

            const cancelClose = () => { if (closeTimer.current) { clearTimeout(closeTimer.current); closeTimer.current = null; } };
            const scheduleClose = () => { cancelClose(); closeTimer.current = setTimeout(() => setOpen(false), 150); };
            const openNow = () => { cancelClose(); setOpen(true); };
            useEffect(() => cancelClose, []);

            const place = () => {
                if (!btnRef.current) return;
                const r = btnRef.current.getBoundingClientRect();
                const margin = 12;
                const w = Math.min(300, window.innerWidth - margin * 2);
                let left = r.left;
                if (left + w > window.innerWidth - margin) left = window.innerWidth - margin - w;
                if (left < margin) left = margin;
                const abreArriba = (window.innerHeight - r.bottom) < 180;
                setPos({
                    left, width: w,
                    top: abreArriba ? null : Math.round(r.bottom + 6),
                    bottom: abreArriba ? Math.round(window.innerHeight - r.top + 6) : null,
                });
            };

            useEffect(() => {
                if (!open) { setPos(null); return; }
                place();
                const reflow = () => place();
                const onDoc = (e) => {
                    if (popRef.current && popRef.current.contains(e.target)) return;
                    if (btnRef.current && btnRef.current.contains(e.target)) return;
                    setOpen(false);
                };
                window.addEventListener('scroll', reflow, true);
                window.addEventListener('resize', reflow);
                document.addEventListener('mousedown', onDoc);
                return () => {
                    window.removeEventListener('scroll', reflow, true);
                    window.removeEventListener('resize', reflow);
                    document.removeEventListener('mousedown', onDoc);
                };
            }, [open]);

            return (
                <span className="inline-block">
                    <button ref={btnRef} type="button" onClick={openNow} onMouseEnter={openNow} onMouseLeave={scheduleClose}
                        className="text-primary font-semibold cursor-help bg-primary/5 hover:bg-primary/10 rounded px-1 transition-colors"
                        style={{ borderBottom: '1px dotted #3D008D' }} title="Ver definición rápida">
                        {children}<i className="fas fa-circle-info text-[0.6em] align-super ml-0.5 text-secondary"></i>
                    </button>
                    {open && pos && ReactDOM.createPortal(
                        <span ref={popRef} role="tooltip"
                            onMouseEnter={cancelClose} onMouseLeave={scheduleClose}
                            className="block rounded-lg bg-white shadow-2xl border border-primary/30 p-3 text-[0.8rem] font-normal text-gray-700 leading-snug animate-fade-in text-left"

        /* ============================================================
           RESALTADO DE SINTAXIS — Prism.js 1.29
           Este curso usa dos lenguajes, Python y R, y Prism trae gramática
           oficial de los dos. No se registra ninguna a mano.
        ============================================================ */
        const GRAMATICA = { python: 'python', r: 'r', shell: 'bash', text: null };

        /* Prefijo de SALIDA por lenguaje: el marcador de comentario del propio
           lenguaje más `>`. Así la salida sigue siendo un comentario válido y
           el bloque copiado se puede ejecutar tal cual.

           Python y R comparten el mismo prefijo `#>`, que es lo que obliga a
           que TODO bloque de código viva dentro de un `CodeTabs`: fuera de él
           nada dice de qué lenguaje es una salida, y la comprobación 9 —la que
           ejecuta el código y contrasta lo declarado— no sabría con qué
           intérprete correrlo. */
        const PREFIJO_SALIDA = { python: '#>', r: '#>' };

        const escaparHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        /* Marca las líneas de salida sobre el HTML YA resaltado. Prism las
           tokeniza como comentario, y un comentario nunca cruza el salto de
           línea, así que cada línea queda autocontenida y se puede envolver. */
        const marcarSalida = (html, lang) => {
            const pref = PREFIJO_SALIDA[lang];
            if (!pref) return html;
            return html.split('\n').map(linea => {
                const plano = linea.replace(/<[^>]*>/g, '').trimStart();
                return plano.startsWith(pref) ? `<span class="tr-salida">${linea}</span>` : linea;
            }).join('\n');
        };

        const resaltar = (codigo, lang) => {
            const nombre = GRAMATICA[lang];
            const gram = (nombre && window.Prism) ? Prism.languages[nombre] : null;
            const html = gram ? Prism.highlight(codigo, gram, nombre) : escaparHtml(codigo);
            return marcarSalida(html, lang);
        };

        /* ============================================================
           METADATOS DE LENGUAJE — orden fijo del curso
           Python → R.

           Python va primero y es la pestaña por defecto a propósito: los
           estudiantes llegan del programa de Estadística con R como lengua
           materna, y el syllabus promete un puente hacia Python. Abrir en
           Python empuja al lenguaje nuevo dejando R a un clic.
        ============================================================ */
        const LANG_ORDEN = ['python', 'r'];
        const LANG_DEFECTO = 'python';
        const LANG_META = {
            python: { label: 'Python', corto: 'Python', icon: 'fab fa-python', color: 'text-yellow-400' },
            r: { label: 'R', corto: 'R', icon: 'fas fa-chart-line', color: 'text-cyan-300' },
            shell: { label: 'Terminal', corto: 'Shell', icon: 'fas fa-terminal', color: 'text-green-400' },
            text: { label: 'Salida', corto: 'Salida', icon: 'fas fa-file-alt', color: 'text-gray-300' },
        };

        /* ============================================================
           BLOQUE DE CÓDIGO (un solo lenguaje)
           La salida NO va en un panel aparte: se escribe dentro del código
           con el prefijo del lenguaje, pegada a la instrucción que la produce.
        ============================================================ */
        const CodeBlock = ({ title, code, lang = LANG_DEFECTO, plegable, conPestanas = false }) => {
            const [copiado, setCopiado] = useState(false);
            const meta = LANG_META[lang] || LANG_META.text;

            // Se pliegan los bloques largos de exposición. Dentro de un
            // ejercicio nunca (`plegable={false}`): una traza que hay que
            // desplegar antes de poder trazarla estorba.
            const admitePliegue = plegable === undefined ? code.split('\n').length > 12 : plegable;
            const [plegado, setPlegado] = useState(admitePliegue);

            const copiar = () => {
                // Se copia `code`, la cadena original. El DOM lleva el marcado
                // de Prism y pegar eso daría un archivo que no corre.
                navigator.clipboard.writeText(code).then(() => {
                    setCopiado(true);
                    setTimeout(() => setCopiado(false), 2000);
                }).catch(() => { });
            };

            return (
                <div className={`tr-code-wrapper my-4 ${conPestanas ? 'con-pestanas' : ''}`}>
                    <div className="tr-code-header">
                        <span className="tr-code-title">
                            <i className={`${meta.icon} mr-2`}></i>{title || meta.label}
                        </span>
                        <span className="flex items-center gap-2">
                            <button className={`tr-code-btn ${copiado ? 'copiado' : ''}`} onClick={copiar}
                                title="Copiar código" aria-label="Copiar código">
                                <i className={`fas ${copiado ? 'fa-check' : 'fa-copy'}`}></i>
                                <span>{copiado ? 'Copiado' : 'Copiar'}</span>
                            </button>
                            {admitePliegue && (
                                <button className="tr-code-btn" onClick={() => setPlegado(p => !p)}
                                    aria-expanded={!plegado} title={plegado ? 'Mostrar todo el código' : 'Plegar el código'}>
                                    <span>{plegado ? 'Mostrar' : 'Ocultar'}</span>
                                    <i className={`fas fa-chevron-down transition-transform duration-200 ${plegado ? '' : 'rotate-180'}`}></i>
                                </button>
                            )}
                        </span>
                    </div>
                    <pre className={`tr-code-pre ${plegado ? 'plegado' : ''}`}>
                        <code dangerouslySetInnerHTML={{ __html: resaltar(code, lang) }} />
                    </pre>
                </div>
            );
        };

        /* ============================================================
           LÍNEA DE TIEMPO
        ============================================================ */
        const Timeline = ({ eventos }) => (
            <div className="relative border-l-2 border-primary/30 ml-3 my-6 space-y-5">
                {eventos.map((e, i) => (
