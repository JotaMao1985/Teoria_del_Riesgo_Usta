                    dos números que este panel ya tiene medidos, y el resultado sorprende: la mayor
                    parte de lo que se puede ganar ya está ganado.
                </Motivacion>

                <h3>La beta se suma con los pesos; el riesgo propio, no</h3>
                <p>
                    Aquí aparece un contraste con el capítulo 1 que conviene no dejar pasar. Allí el
                    rendimiento logarítmico <strong>no</strong> era lineal en los pesos y hubo que medir
                    el costo de tratarlo como si lo fuera. La beta sí lo es, y de forma exacta: es una
                    covarianza dividida por una constante, y la covarianza es bilineal.
                </p>
                <Eq>{'$$\\beta_p = \\frac{\\mathrm{Cov}\\left(\\sum_i w_i r_i,\\; r_M\\right)}{\\mathrm{Var}(r_M)} = \\sum_i w_i\\,\\frac{\\mathrm{Cov}(r_i, r_M)}{\\mathrm{Var}(r_M)} = \\sum_i w_i\\beta_i$$'}</Eq>

                <CodeTabs titulo="Las dos formas de obtener la beta del portafolio" bloques={EJ_PONDERADA}
                    nota="Coinciden hasta la doceava cifra decimal, y no por casualidad: son la misma operación escrita de dos maneras. La diferencia se imprime con doce decimales y no en notación científica a propósito — con `%.2e` una pestaña diría 2.22e-16 y la otra 0.00e+00, y el material afirmaría dos cosas distintas por un residuo de coma flotante." />

                <p>
                    Las tres últimas líneas dicen lo contrario para el riesgo propio: la desviación
                    residual media de los cuatro emisores es <strong>2,2078 %</strong> y la del
                    portafolio, <strong>1,3031 %</strong>. Juntarlos canceló el 41 % del riesgo
                    idiosincrásico sin tocar nada de la beta. Ese es el negocio entero de la
                    diversificación, y explica por qué en la tabla de la sección 1 la proporción
                    sistemática del portafolio (31,7 %) es más alta que la de cualquiera de sus partes:
                    no subió el numerador, bajó el denominador.
                </p>

                <h3>Cuántos activos hacen falta</h3>
                <p>
                    Si se reparte por igual entre N activos cuya desviación típica vale en promedio
                    <em>sigma media</em> y cuya correlación entre sí vale en promedio <em>rho media</em>, la varianza del portafolio tiene una forma
                    cerrada que separa lo que se va de lo que se queda:
                </p>
                <Eq>{'$$\\sigma_p^2 = \\frac{\\bar{\\sigma}^2}{N} + \\left(1 - \\frac{1}{N}\\right)\\bar{\\rho}\\,\\bar{\\sigma}^2 \\qquad\\xrightarrow[N\\to\\infty]{}\\qquad \\bar{\\rho}\\,\\bar{\\sigma}^2$$'}</Eq>
                <p>
                    El primer término es el riesgo propio y se va como 1/N. El segundo es la covarianza
                    media y <strong>no se va nunca</strong>: por muchos activos que se añadan, el riesgo
                    del portafolio no baja de la <strong>sigma media multiplicada por la raíz de la rho
                    media</strong> — 1,1322 % en este panel. La
                    diversificación no es una cuestión de cantidad sino de correlación, y por eso el
                    capítulo 7 optimiza sobre la matriz de covarianzas y no sobre el número de emisores.
                </p>

                    nota="Todo se calcula en el navegador con la fórmula de arriba, sin ninguna cifra precomputada. Los deslizadores se mueven en pasos redondos para que se puedan fijar a mano, así que sus valores iniciales —0,23 y 2,40 %— no son exactamente los del panel, que son 0,2268 y 2,3776 %: con los redondos, N = 4 da 1,5600 % contra los 1,5410 % del bloque. La diferencia está en los deslizadores, no en la fórmula."

        const Seccion5 = () => (

                <h3>Primer límite: la beta se mueve</h3>
                <p>
                    Toda la sección 3 trató la beta como un número. La sección 2 ya avisó de que es una

                <CodeTabs titulo="La misma beta, estimada en distintos trozos de la misma muestra" bloques={EJ_RODANTE}
                    nota="La columna del rango es la que importa: Ecopetrol va de 0,3977 a 1,6219 según qué 250 ruedas se usen. Ninguna de esas estimaciones está mal calculada, y todas describen el mismo activo." />

                <p>
                    Grupo Sura merece un párrafo aparte: su beta pasó de 0,8851 en 2018–2021 a 0,4762 en
                    2022–2025, una caída del 46 %. Con betas estimadas sobre subperiodos de cuatro años
                    y errores estándar de 0,04 y 0,09, esa diferencia no es ruido de estimación: es que
                    la relación entre el activo y el mercado cambió. Un fondo que en 2025 use la beta de
                    la muestra completa —0,7369— para cubrir esa posición está usando un promedio de dos

                <Laboratorio
                    titulo="R9 · Elija la ventana y mire qué beta le sale"
                    id="cap3-lab-rodante"
                    altura="chart-h-420"
                    enunciado="Beta rodante recalculada en cada rueda con las anteriores que quepan en la ventana, para Ecopetrol y para el portafolio del fondo. La línea punteada roja es β = 1 y las horizontales tenues son las betas de la muestra completa: 0,9009 y 0,6779. Mueva la ventana y mire cuánto de lo que la sección 2 llamó «la beta» era la ventana."
                    controles={[
                        { id: 'vent', etiqueta: 'Ventana de estimación (ruedas)', min: 60, max: 1000, paso: 10, valor: 250, formato: v => `${miles(v)}` },
                    ]}
                    calcular={(p) => {
                        const v = Math.round(p.vent);
                        // El recorrido va DESDE EL FINAL hacia atrás para que el
                        // último punto dibujado sea siempre la última rueda. Yendo
                        // hacia adelante de cuatro en cuatro, la curva terminaba en
                        // la rueda 1 914 y su extremo derecho mostraba 1,0923 para
                        // Ecopetrol donde el bloque de esta sección declara 0,9718.
                        const serie = (ys, color, nombre) => {
                            const idx = [];
                            for (let i = ys.length; i >= v; i -= 4) idx.push(i);
                            idx.reverse();
                            const xs = [], bs = [];
                            for (const i of idx) {
                                xs.push(IDX_F[Math.min(IDX_F.length - 1, Math.floor(i / 4))]);
                                bs.push(beta(ys.slice(i - v, i), RM.slice(i - v, i)));
                            }
                            return {
                                x: xs, y: bs, type: 'scatter', mode: 'lines',
                                line: { color, width: 1.9 }, name: nombre,
                                hovertemplate: '%{x} · β %{y:.4f}<extra>' + nombre + '</extra>',
                            };
                        };
                        return {
                            traces: [serie(RE, '#B45309', 'Ecopetrol'), serie(RP, '#3D008D', 'Portafolio del fondo')],
                            layout: {
                                separators: ',.',
                                margin: { t: 30, r: 16, b: 46, l: 52 },
                                xaxis: { title: 'Fecha en que termina la ventana' },
                                yaxis: { title: 'Beta estimada', range: [-0.6, 2.8] },
                                legend: { orientation: 'h', y: 1.14, x: 0, font: { size: 10 } },
                                shapes: [
                                    { type: 'line', xref: 'paper', x0: 0, x1: 1, y0: 1, y1: 1, line: { color: '#B91C1C', width: 2, dash: 'dash' } },
                                    { type: 'line', xref: 'paper', x0: 0, x1: 1, y0: 0.9009, y1: 0.9009, line: { color: '#B45309', width: 1, dash: 'dot' } },
                                    { type: 'line', xref: 'paper', x0: 0, x1: 1, y0: 0.6779, y1: 0.6779, line: { color: '#3D008D', width: 1, dash: 'dot' } },
                                ],
                            },
                        };
                    }}
                    lectura={(p) => {
                        const v = Math.round(p.vent);
                        // La lectura recorre TODAS las ventanas, de una en una,
                        // aunque la curva se dibuje cada cuatro: si tomara el
                        // mismo muestreo que el trazo, el mínimo declarado aquí
                        // sería 0,4058 donde el bloque de código dice 0,3977, y
                        // el material se contradiría en silencio.
                        const rec = (ys) => {
                            const bs = [];
                            for (let i = v; i <= ys.length; i++) bs.push(beta(ys.slice(i - v, i), RM.slice(i - v, i)));
                            return bs;
                        };
                        const be = rec(RE), bp = rec(RP);
                        return `Con ventanas de ${miles(v)} ruedas, la beta de Ecopetrol va de ${dec(Math.min(...be), 4)} `

                            + `y termina en ${dec(bp[bp.length - 1], 4)}. `
                            + `De las ${bp.length} ventanas que caben en la muestra, ${bp.filter(b => b > 0.9).length} dan una beta del portafolio por encima de 0,90.`;
                    }}
                    pregunta="Con la ventana en 250, la beta del portafolio pasa de 0,30 a 1,01 a lo largo de la muestra. Con la ventana en 1 000 se aplana entre 0,50 y 0,70. Una ventana larga da un número más estable: ¿significa eso que estima mejor? Diga qué está midiendo cada una y por qué la estabilidad no es, por sí sola, un argumento a favor."
                    nota="El cálculo se hace en el navegador sobre las mismas series RM, RE y RP que producen los bloques, y con la misma definición de beta. Comprobado contra el bloque de esta sección: con ventana 250, la última beta da 0,9718 para Ecopetrol y 0,7646 para el portafolio, que es exactamente lo que el bloque declara. La curva se evalúa cada cuatro ruedas para que el deslizador responda; los valores no cambian por ello."
                />

                <h3>Segundo límite: el R² es bajo, y eso no significa lo que parece</h3>
                <p>
                    Los cuatro R² de este capítulo van de 0,0472 a 0,2344. En cualquier otro contexto
                    esas cifras se leerían como un modelo que no sirve. Aquí no significan eso, y

                <h3>Tercer límite, y el que cambia este capítulo: la beta de 0,68 es un artefacto</h3>
                <p>
                    Vuelva a la pregunta de la motivación. El portafolio del fondo son cuatro de los
                    emisores más grandes de la bolsa, y su beta contra el ETF que replica esa misma bolsa
                    es 0,6779. La explicación no está en la teoría: está en cuántas veces se negoció cada
                    cosa.
                </p>

                <CodeTabs titulo="Cuántas ruedas no se negoció cada serie, y qué le pasa a la beta al espaciarla" bloques={EJ_FRECUENCIA}
                    nota="Las dos mitades del bloque hay que leerlas juntas: la primera cuenta el problema y la segunda lo mide. El ETF se mueve casi todos los días —solo el 4,9 % de las ruedas queda quieto— y los emisores, no." />

                <CalloutPro tema="danger" titulo="Negociación no simultánea: el sesgo que se llevó un tercio de la beta"
                    subtitulo="El mismo defecto del panel que el capítulo 4 declaró, midiendo su tercera consecuencia">
                    <p>
                        Banco de Bogotá no cambia de precio el <strong>16,2 %</strong> de las ruedas y
                        Grupo Sura el 15,1 %, mientras el ETF solo el 4,9 %. Cuando el mercado se mueve
                        un día y la acción no se negoció, ese movimiento aparece en el precio de la
                        acción al día siguiente, no ese día. La covarianza contemporánea —que es el
                        numerador de la beta— se pierde ese trozo, y la beta sale{' '}
                        <strong>sesgada hacia abajo</strong>. Es el efecto que Dimson formalizó en 1979 y
                        que en mercados poco líquidos no es un detalle.
                    </p>
                    <p>
                        La segunda mitad del bloque lo demuestra sin ninguna teoría: si el rendimiento se
                        mide cada dos ruedas, la beta del portafolio sube de 0,6779 a 0,8368; cada
                        semana, a <strong>0,9486</strong>; cada mes, a <strong>0,9984</strong>. Espaciar
                        el intervalo le da tiempo a la acción a incorporar el movimiento del mercado, y
                        la beta converge a donde la teoría decía que tenía que estar: cerca de uno, como
                        corresponde a una cartera que está dentro del índice.
                    </p>
                    <p>
                        La lectura correcta de la beta diaria de 0,6779, entonces, <strong>no</strong> es
                        «el portafolio del fondo es defensivo». Es «con datos diarios de un mercado
                        ilíquido, un tercio de la exposición al mercado no se ve». Un fondo que cubra su
                        posición con futuros usando 0,6779 se quedará corto de cobertura en cerca de un
                        tercio del nominal justo cuando el mercado se mueva de verdad — y sobre 800 000
                        millones eso son unos 217 000 millones sin cubrir.
                    </p>
                    <p>
                        Fíjese en el 0,8522 de la fila quincenal, que rompe la progresión. Con 191
                        observaciones el error de estimación ya es grande y una fila suelta no dice nada:
                        la evidencia es la tendencia de las cinco, no cualquiera de ellas.
                    </p>
                </CalloutPro>

                <Box type="tip" label="El mismo dato malo, cuatro sensibilidades">
                    Este es el cuarto estimador que el material pasa por las anomalías del panel, y el
                    cuadro ya está completo. Excluir el par defectuoso del 19 y 20 de febrero de 2025
                    mueve el VaR histórico de la muestra completa un 1 %, la volatilidad un 5 %, el VaR
                    de la ventana de 250 ruedas un 10 % — y la beta, un 0,5 %. La beta es el estimador
                    más robusto de los cuatro frente a ese defecto, porque es un cociente en el que la
                    observación anómala entra arriba y abajo. Pero es el <strong>único</strong> de los
                    cuatro al que le hace daño el otro defecto, el de las ruedas sin variación, que a los
                    otros tres no les hace casi nada. No hay un dato limpio: hay estimadores sensibles a
                    cosas distintas.
                </Box>

                <h3>Cuarto límite: la prima de mercado no se puede estimar con ocho años</h3>
                <p>
                    La sección 3 dejó tres líneas sin comentar. El error estándar de la media del mercado
                    es de <strong>7,53 puntos porcentuales anuales</strong> sobre una prima estimada de
                    1,34: el intervalo de confianza al 95 % va de −13,43 % a +16,10 %. No es que la prima
                    sea baja; es que <strong>no se sabe</strong>.
                </p>
                <Eq>{'$$\\mathrm{EE}\\left(\\bar{r}\\right) = \\frac{\\sigma}{\\sqrt{n}} \\qquad\\Longrightarrow\\qquad n = \\left(\\frac{\\sigma}{\\mathrm{EE}}\\right)^2$$'}</Eq>
                <p>
                    La última línea del bloque de la sección 3 despeja esa n: para conocer la prima con
                    un error de un punto porcentual harían falta <strong>431 años</strong> de datos. Y no
                    hay atajo, porque el error estándar de una media baja con la raíz de n y la
                    volatilidad anual del mercado es del 20,8 %. Compárelo con lo que pasa con la beta,
                    que se estima con esos mismos 1 916 datos y da un intervalo de 0,09 de ancho: la beta
                    es un cociente de <em>segundos</em> momentos y se estima bien con muestras que no
                    alcanzan ni de lejos para el <em>primero</em>. Por eso el CAPM se usa a diario para
                    medir riesgo y casi nunca para predecir rendimientos, aunque la ecuación sea la misma.
                </p>

                            <p>
                                Una defensa que resiste tiene <strong>tres piezas</strong>. La primera es
                                que la ventana la fija el uso: para una cobertura que se rebalancea cada
                                semana interesa la exposición actual, así que 250 ruedas —un año— es
                                razonable; para el costo de capital de un activo regulado a veinte años,
                                usar un año de datos es absurdo y corresponde una ventana larga o una beta
                                ajustada hacia uno. La segunda es que{' '}
                                <strong>la frecuencia no es libre en este mercado</strong>: el bloque de
                                esta sección muestra que la beta diaria está sesgada hacia abajo por la
                                negociación no simultánea, así que hay que estimar también a frecuencia
                                semanal y reportar las dos, o aplicar un ajuste tipo Dimson. Declarar solo

                                subperiodos: 0,7369 para Grupo Sura esconde 0,8851 y 0,4762, y quien

                            </p>
                            <p>
                                Lo que <strong>no</strong> resiste: estimar con varias ventanas y reportar
                                la que más se parece a lo que se esperaba; usar la beta diaria para una
                                cobertura sin mencionar el sesgo; o presentar una beta sin decir contra qué
                                sustituto de mercado se estimó. Esto último es la crítica de Roll de 1977 en
                                versión práctica: el ICOLCAP no es el portafolio de mercado, es un ETF con su
                                propia liquidez, y toda beta de este capítulo es beta <em>contra ese ETF</em>.
                            </p>
                        </>}>
                        <p>
                            Usted responde por la ficha de riesgo de mercado del fondo, y en ella va una

                            muestra.
                        </p>
                        <p>
                            Argumente en un párrafo qué ventana y qué frecuencia declara en el manual, y

                            elección, qué evidencia de este capítulo la sostiene, qué le pasaría a la

                    },
                    {
                        label: 'Las cifras del capítulo',
                        content: (
                            <ul>
                                <li><strong>Betas:</strong> Ecopetrol 0,9009 · Banco de Bogotá 0,3466 · Grupo Sura 0,7369 · ISA 0,6165 · portafolio 0,6779.</li>
                                <li><strong>Precisión:</strong> la beta del portafolio con IC de 0,09 de ancho; la prima de mercado con uno de 29,5 puntos.</li>
                                <li><strong>Diversificación:</strong> volatilidad media 2,3776 % · correlación media 0,2268 · suelo 1,1322 %, el 47,6 % del riesgo de un activo suelto.</li>
                                <li><strong>Frecuencia:</strong> beta del portafolio 0,6779 diaria · 0,9486 semanal · 0,9984 mensual.</li>
                            </ul>
                        ),
                    },
                    {
                        label: 'Lo que el CAPM no da',
                        content: (
                            <ul>
                                <li><strong>Una beta estable.</strong> Rango rodante de 0,3977 a 1,6219 en el mismo activo.</li>
                                <li><strong>Una prima estimable.</strong> 431 años de datos para un error de un punto porcentual.</li>
                                <li><strong>Un portafolio de mercado.</strong> Solo un sustituto —aquí un ETF— que es la crítica de Roll.</li>
                                <li><strong>Una beta limpia de microestructura.</strong> Un tercio de la del portafolio se lo lleva la negociación no simultánea.</li>
                            </ul>
                        ),
                    },
                ]} />
            </>
        );

        /* ============================================================
           CURRÍCULO
        ============================================================ */
        const curriculum = [
            { id: 'portada', title: 'Portada y objetivos', icon: 'BookOpen', component: PortadaSection },
            { id: 'sec1', title: '1. Descomposición de la varianza', icon: 'Layers', component: Seccion1 },
            { id: 'sec2', title: '2. Beta y su error estándar', icon: 'TrendingUp', component: Seccion2 },
            { id: 'sec3', title: '3. CAPM y la línea de mercado', icon: 'Scale', component: Seccion3 },
            { id: 'sec4', title: '4. Riesgo diversificable', icon: 'Sliders', component: Seccion4 },
            { id: 'sec5', title: '5. Los límites del modelo', icon: 'Bug', component: Seccion5 },
            { id: 'eval', title: 'Evaluación', icon: 'Award', component: EvaluacionSection },
        ];

        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            // El `<head>` NO lo estampa `migrar.py`, así que un capítulo nacido
            // de copiar `tr-base.html` arrastra su título y su descripción sin
            // que nada avise: la pestaña del navegador dice «Plantilla base» y
            // eso es lo que ve quien tiene quince capítulos abiertos, y lo que
            // indexa GitHub Pages. Se derivan de `CONFIG`, que sí es lo primero
            // que cambia todo capítulo, para que ninguno pueda olvidarlo.
            useEffect(() => {
                document.title = `Cap. ${CONFIG.numero} · ${CONFIG.titulo} — Teoría del Riesgo`;
                const meta = document.querySelector('meta[name="description"]');
                if (meta) meta.setAttribute('content',
                    `${CONFIG.titulo}. ${CONFIG.subtitulo} · ${CONFIG.unidad} · `
                    + `Teoría del Riesgo, Universidad Santo Tomás.`);
            }, []);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 tr-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col tr-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `tr-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                Teoría del Riesgo
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg tr-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.unidad}</p>
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Python · R</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full tr-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white tr-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="prose-tr animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white tr-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="tr-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            Medir es fácil; defender el supuesto es el oficio.
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · Teoría del Riesgo
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            Material de aprendizaje autónomo. Casos contextualizados al mercado financiero colombiano.
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
