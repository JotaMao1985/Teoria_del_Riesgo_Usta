                'wb = np.array([0.00, 0.00, 0.25, 0.25])   # bloque B: holding e infraestructura',
                'es_a  = es(-(r @ wa) * 100, 0.975)',
                'es_b  = es(-(r @ wb) * 100, 0.975)',
                'es_ab = es(-(r @ (wa + wb)) * 100, 0.975)',
                '',
                'print(f"ES(A) + ES(B) = {es_a + es_b:.4f} %   >=   ES(A+B) = {es_ab:.4f} %")',
                '# Queda comprobado que el ES es subaditivo y que el VaR no lo seria en este panel.',
            ],
            r: [
                'precios  <- read.csv("datos/bvc_diario.csv")',
                'acciones <- c("ECOPETROL.CL", "BOGOTA.CL", "GRUPOSURA.CL", "ISA.CL")',
                'r <- diff(log(as.matrix(precios[, acciones])))',
                '',
                'es <- function(perdida, a) {',
                '  v <- quantile(perdida, a, names = FALSE)',
                '  mean(perdida[perdida > v])',
                '}',
                '',
                'wa <- c(0.30, 0.20, 0.00, 0.00)          # bloque A: petroleo y banca',
                'wb <- c(0.00, 0.00, 0.25, 0.25)          # bloque B: holding e infraestructura',
                'es_a  <- es(-as.vector(r %*% wa) * 100, 0.975)',
                'es_b  <- es(-as.vector(r %*% wb) * 100, 0.975)',
                'es_ab <- es(-as.vector(r %*% (wa + wb)) * 100, 0.975)',
                '',
                'cat(sprintf("ES(A) + ES(B) = %.4f %%   >=   ES(A+B) = %.4f %%\\n", es_a + es_b, es_ab))',
                '# Queda comprobado que el ES es subaditivo y que el VaR no lo seria en este panel.',

        /* ============================================================

        ============================================================ */
        const PortadaSection = () => (

                        (déficit esperado) por los tres caminos del capítulo 4, y por qué Basilea

                    Bogotá 20 %, Grupo Sura 25 % e ISA 25 %. El capítulo 4 cerró con un VaR 99 % a un día

                <Timeline eventos={[
                    { year: '1997', text: 'Artzner, Delbaen, Eber y Heath publican «Thinking Coherently» y proponen cuatro axiomas. El VaR incumple uno, y el resultado tarda veinte años en llegar a la norma.' },
                    { year: '1999', text: '«Coherent Measures of Risk» formaliza el marco. Aparece el Expected Shortfall como la medida coherente más simple que respeta el mismo nivel de confianza.' },
                    { year: '2000', text: 'Rockafellar y Uryasev muestran que el CVaR se optimiza con un programa lineal. La medida deja de ser solo un diagnóstico y pasa a ser un objetivo: es el capítulo 8.' },

        const Seccion1 = () => {

            return (
                <>
                    <Motivacion icon="fa-scale-balanced"
                        gancho="Si juntar dos mesas puede aumentar el riesgo total medido, el número deja de servir para lo único que el banco necesita: repartir límites.">
                        El área de riesgo parte la tesorería en dos mesas para controlarlas mejor y le
                        asigna a cada una su límite de VaR. Al consolidar, el VaR del conjunto sale mayor
                        que la suma de los dos límites. El jefe de riesgos pregunta si hay un error de
                        agregación. No lo hay: la medida que eligieron permite ese resultado, y hay una
                        forma de demostrarlo con dos bonos y un papel.
                    </Motivacion>

                    <h3>Qué se le puede exigir a un número que resume el riesgo</h3>
                    <p>
                        Una <Termino def="Una función que a cada distribución de pérdidas le asigna un número: el capital que hay que tener para soportarla.">medida de riesgo</Termino> ρ
                        toma la pérdida aleatoria L de una posición y devuelve un número en pesos. La
                        pregunta de 1997 fue: ¿qué propiedades debería cumplir <em>cualquier</em> medida
                        para que las decisiones que se toman con ella tengan sentido? La respuesta fueron
                        cuatro axiomas, y una medida que los cumple los cuatro se llama{' '}
                        <strong>coherente</strong>.
                    </p>

                    <Accordion items={[
                        {
                            titulo: '1 · Monotonía — si una posición pierde siempre más, debe medir más',
                            contenido: 'Formalmente: si L₁ ≤ L₂ en todos los escenarios, entonces ρ(L₁) ≤ ρ(L₂). Parece trivial y no lo es: una medida basada solo en la volatilidad la incumple, porque castiga la dispersión hacia arriba igual que hacia abajo. Un activo que a veces gana mucho y nunca pierde más que otro tiene más varianza y menos riesgo. El VaR y el ES la cumplen los dos.',
                        },
                        {
                            titulo: '2 · Invarianza por traslación — el efectivo resta peso a peso',
                            contenido: 'ρ(L + c) = ρ(L) + c. Añadir una pérdida cierta de c aumenta el requerimiento en exactamente c; guardar c en caja lo reduce en exactamente c. Es lo que convierte a ρ en una medida de CAPITAL y no en un índice: dice cuánto efectivo hace falta para que la posición pase a ser aceptable. El VaR y el ES la cumplen.',
                        },
                        {
                            titulo: '3 · Homogeneidad positiva — doblar la posición dobla el riesgo',
                            contenido: 'ρ(λL) = λ ρ(L) para λ ≥ 0. Es la propiedad que permite hablar de riesgo por peso invertido y la que hace que el reparto por componentes del capítulo 4 sume el total. Su límite conocido es la liquidez: una posición diez veces mayor puede ser más de diez veces más difícil de deshacer, y de eso se ocupa la sección 5. El VaR y el ES la cumplen.',
                        },
                        {
                            titulo: '4 · Subaditividad — juntar no puede empeorar: ρ(L₁ + L₂) ≤ ρ(L₁) + ρ(L₂)',
                            contenido: 'Diversificar no puede aumentar el riesgo medido. Es el axioma que sostiene todo lo demás: sin él, los límites por mesa no agregan, el reparto de capital no cierra, y partir una cartera en trozos puede reducir artificialmente el requerimiento. Es el que el VaR incumple, y la sección 2 lo demuestra con un ejemplo de dos líneas.',
                        },
                    ]} />

                    <Eq>{'$$\\rho(L_1 + L_2) \\;\\le\\; \\rho(L_1) + \\rho(L_2)$$'}</Eq>

                    <Box type="tip" label="Por qué la subaditividad es la que se lleva el capítulo">
                        Los otros tres axiomas los cumplen casi todas las medidas que alguien usaría. La
                        subaditividad es la que separa, y es también la que tiene consecuencias
                        operativas todos los días: si no se cumple, un banco puede bajar su capital
                        regulatorio <strong>partiendo</strong> una cartera entre filiales, y el
                        supervisor no puede sumar los límites de las mesas para obtener el límite de la
                        tesorería. Deja de ser un tecnicismo en cuanto alguien tiene que firmar el
                        agregado.
                    </Box>

                    <h3>Dos carteras que la medida no distingue</h3>

                        Antes del contraejemplo formal, uno que se ve. Las dos carteras de abajo son

                        además, gana más en promedio: es el fondo financiando cobertura con la venta de
                        opciones muy fuera de dinero, que recorta las pérdidas medianas y compra a
                        cambio un escenario catastrófico.
                    </p>

                    <CodeTabs titulo="Dos carteras con el mismo VaR y colas incomparables" bloques={EJ_CARTERAS}
                        nota="Las dos pestañas dan exactamente lo mismo porque los escenarios van literales. La función `var_es` es la misma en los dos lenguajes y se reutiliza en la sección 2 con los dos bonos." />

                    <Emparejamiento
                        titulo="R6 · Cada axioma con lo que se rompe cuando falla"
                        enunciado="No se trata de repetir la definición: empareje cada propiedad con la consecuencia concreta que su incumplimiento tendría en la operación de una entidad vigilada. Una de las cuatro es la que el VaR incumple."
                        etiquetaIzq="Propiedad"

                        izquierda={['Monotonía', 'Invarianza por traslación', 'Homogeneidad positiva', 'Subaditividad']}
                        derecha={[
                            'Los límites por mesa dejan de agregar: la suma de los límites no acota el consolidado, y partir la cartera puede bajar el capital exigido',

                            'Una posición que pierde más en todos los escenarios podría exigir menos capital que otra que pierde menos',

                        solucion={[2, 1, 3, 0]}
                    />

                    <Ejercicio tipo="R2">
                        <MCQ
                            pregunta="Las carteras A y B declaran el mismo VaR 99 % de 25 000 millones, y B tiene además mayor ganancia esperada. Un gestor concluye que B domina a A. ¿Qué está pasando por alto?"
                            opciones={[

                                { texto: 'Que B tiene mayor varianza, y la varianza es la medida de riesgo correcta para comparar dos carteras con el mismo VaR.', correcta: false },
                                { texto: 'Nada: con el mismo VaR y más ganancia esperada, B efectivamente domina a A bajo cualquier medida coherente.', correcta: false },
                            ]}
                        />
                    </Ejercicio>
                </>
            );
        };


        /* ============================================================
           SECCIÓN 2 — DÓNDE FALLA EL VaR
        ============================================================ */
        const Seccion2 = () => (
            <>
                <Motivacion icon="fa-link-slash"
                    gancho="Dos bonos, cuatro por ciento de probabilidad de incumplimiento y un nivel de confianza del noventa y cinco. Con eso basta para romper la medida.">
                    El fondo compra dos bonos corporativos de emisores distintos, 100 000 millones cada
                    uno. El área de riesgo mide el VaR de cada posición: los dos dan una ganancia de
                    2 000 millones, porque a un 95 % de confianza el incumplimiento no aparece. Mide
                    después la cartera con las dos juntas y obtiene 98 000 millones de pérdida.
                    Diversificar acaba de multiplicar el riesgo medido. El cálculo está bien.
                </Motivacion>

                <h3>El contraejemplo, construido</h3>
                <p>
                    Todo lo que hace falta es que la probabilidad de incumplimiento sea{' '}
                    <strong>menor</strong> que la probabilidad de la cola —de modo que un solo bono no
                    tenga su incumplimiento dentro del 5 % peor— y que con dos bonos la probabilidad de
                    que <em>alguno</em> incumpla sí entre en esa cola. Entre esos dos límites el VaR
                    falla, y el ejemplo es tan pequeño que cabe en una servilleta.
                </p>

                <Derivacion
                    titulo="De dos bonos sanos a una cartera que mide peor que la suma"
                    pasos={[
                        {
                            eq: <Eq>{'$$L_i = \\begin{cases} -2\\,000 & \\text{con probabilidad } 0{,}96 \\\\ 100\\,000 & \\text{con probabilidad } 0{,}04 \\end{cases}$$'}</Eq>,
                            porque: 'La pérdida de cada bono tiene dos escenarios y nada más. Si el emisor paga, el fondo se queda el cupón: pérdida de −2 000, es decir una ganancia. Si incumple, se pierde el principal entero. La probabilidad de incumplimiento es del 4 %, y ese 4 % es la única cifra que importa del ejemplo.',
                        },
                        {
                            eq: <Eq>{'$$\\mathbb{P}(L_i \\le -2\\,000) = 0{,}96 \\;\\ge\\; 0{,}95 \\quad\\Longrightarrow\\quad \\mathrm{VaR}_{0{,}95}(L_i) = -2\\,000$$'}</Eq>,
                            porque: 'El cuantil al 95 % es el primer valor cuya acumulada alcanza 0,95, y el escenario bueno ya la alcanza con 0,96. El incumplimiento tiene probabilidad 4 %, que es MENOR que el 5 % de la cola: queda fuera del alcance de la medida. El VaR de cada bono por separado es una ganancia de 2 000 millones.',
                        },
                        {
                            eq: <Eq>{'$$\\mathrm{VaR}_{0{,}95}(L_1) + \\mathrm{VaR}_{0{,}95}(L_2) = -4\\,000$$'}</Eq>,
                            porque: 'Si la subaditividad se cumpliera, este número acotaría por arriba el riesgo de tener los dos. La suma de los límites de dos mesas acotaría el límite de la tesorería. Es exactamente lo que un área de riesgo da por supuesto al repartir cupos.',
                        },
                        {
                            eq: <Eq>{'$$L_1 + L_2 = \\begin{cases} -4\\,000 & 0{,}9216 \\\\ 98\\,000 & 0{,}0768 \\\\ 200\\,000 & 0{,}0016 \\end{cases}$$'}</Eq>,
                            porque: 'Los dos emisores son independientes, así que las probabilidades salen de la binomial: 0,96² de que ninguno incumpla, 2 × 0,04 × 0,96 de que incumpla exactamente uno, y 0,04² de que incumplan los dos. La independencia es el caso MÁS favorable a la diversificación, y aun así el resultado es el que sigue.',
                        },
                        {
                            eq: <Eq>{'$$\\mathbb{P}(L_1+L_2 \\le -4\\,000) = 0{,}9216 \\;<\\; 0{,}95 \\quad\\Longrightarrow\\quad \\mathrm{VaR}_{0{,}95} = 98\\,000$$'}</Eq>,
                            porque: 'Aquí está todo el ejemplo. Con dos bonos, la probabilidad de que ninguno incumpla ya no llega al 95 %, así que el corte se corre al siguiente escenario y de repente el incumplimiento SÍ está dentro de la cola. El VaR salta de una ganancia de 4 000 a una pérdida de 98 000 millones.',
                        },
                        {
                            eq: <Eq>{'$$98\\,000 \\;>\\; -4\\,000 \\quad\\Longrightarrow\\quad \\rho(L_1+L_2) > \\rho(L_1)+\\rho(L_2)$$'}</Eq>,
                            porque: 'La subaditividad se rompe, y no por un margen discutible: por 102 000 millones sobre una cartera de 200 000. No hay ningún error de cálculo y no hay ninguna correlación escondida —los bonos son independientes—. Es la definición de cuantil la que produce el salto.',
                        },
                    ]}
                    cierre="Con el Expected Shortfall el mismo ejemplo da 101 264 millones para la cartera contra 159 200 de la suma: la desigualdad se respeta, y con holgura. No es suerte: el ES es coherente para cualquier distribución, y esa es la razón por la que existe este capítulo."
                />

                <CodeTabs titulo="El contraejemplo, en los dos lenguajes" bloques={EJ_BONOS}
                    nota="Los escenarios van literales y la probabilidad sale de la binomial, así que las dos pestañas coinciden dígito a dígito. Es la misma función `var_es` de la sección 1." />

                <TablaTraza
                    titulo="R1 · El VaR y el ES de la cartera, a mano"
                    enunciado={<>Complete el cálculo con los dos bonos independientes del bloque: principal 100 000 millones, cupón 2 000 y probabilidad de incumplimiento del 4 %. Trabaje con <strong>los números que ve</strong> —cada casilla es exactamente el producto o la suma de las de al lado— y en millones de pesos. El nivel es el 95 %.</>}
                    codigo={{
                        python: `p, principal, cupon = 0.04, 100_000.0, 2_000.0

par_x = np.array([-2*cupon, principal - cupon, 2*principal])
par_p = np.array([(1 - p)**2, 2*p*(1 - p), p**2])

# VaR: el primer escenario cuya acumulada llega a 0.95
# ES : la media de la peor masa 1 - 0.95 = 0.05`,
                        r: `p <- 0.04; principal <- 100000; cupon <- 2000

par_x <- c(-2*cupon, principal - cupon, 2*principal)
par_p <- c((1 - p)^2, 2*p*(1 - p), p^2)

# VaR: el primer escenario cuya acumulada llega a 0.95
# ES : la media de la peor masa 1 - 0.95 = 0.05`,
                    }}
                    columnas={[

                        { clave: 'valor', titulo: 'Valor' },

                    filas={[
                        { paso: '1', instruccion: 'P(no incumple ninguno) = 0.96 × 0.96', valor: '0.9216' },
                        { paso: '2', instruccion: 'P(incumple exactamente uno) = 2 × 0.04 × 0.96', valor: '0.0768' },
                        { paso: '3', instruccion: 'P(incumplen los dos) = 0.04 × 0.04', valor: '0.0016' },
                        { paso: '4', instruccion: 'VaR 95 %: el primer escenario cuya acumulada llega a 0.95 (millones)', valor: '98000' },
                        { paso: '5', instruccion: 'masa de la cola que queda tras los dos incumplimientos: 0.05 − 0.0016', valor: '0.0484' },
                        { paso: '6', instruccion: 'aporte del escenario de dos incumplimientos: 0.0016 × 200000', valor: '320' },
                        { paso: '7', instruccion: 'aporte del escenario de un incumplimiento: 0.0484 × 98000', valor: '4743.2' },
                        { paso: '8', instruccion: 'ES 95 % = (paso 6 + paso 7) / 0.05 (millones)', valor: '101264' },
                    ]}
                    ocultas={['valor']}
                    pista="El paso 4 no pide interpolar nada: con una distribución discreta el cuantil es un escenario del soporte, y hay que preguntarse cuál es el primero que acumula 0,95 desde el mejor. El paso 5 es la clave del ES: la cola mide 5 % de probabilidad, los dos incumplimientos solo aportan 0,16 %, y el resto se completa con el escenario de un incumplimiento — partido, no entero."
                />

                <h3>Y sin embargo, sobre este panel, el VaR sí es subaditivo</h3>
                <p>
                    Conviene no sacar la conclusión de más. Que un axioma no se cumpla{' '}
                    <strong>siempre</strong> no significa que falle <strong>a menudo</strong>. Sobre los
                    rendimientos diarios del fondo, con cuatro acciones que se mueven juntas y sin
                    escenarios de incumplimiento, el VaR se comporta bien: la cartera mide menos que la
                    suma de sus partes, igual que el ES.

                <h3>Un ES no, cinco</h3>
                <p>
                    El FRTB no calcula una medida a un horizonte único. Asigna a cada factor de riesgo un{' '}
                    <Termino def="El tiempo que se supone necesario para deshacer o cubrir una posición sin mover el precio. El FRTB lo fija por categoría de factor en 10, 20, 40, 60 o 120 días.">horizonte de liquidez</Termino>{' '}
                    de entre cinco posibles y calcula un ES por cada tramo, moviendo solo los factores
                    cuyo horizonte llega o supera ese tramo y congelando los demás. Después agrega los
                    cinco así:
                </p>
                <Eq>{'$$\\mathrm{ES} = \\sqrt{\\left(\\mathrm{ES}_1\\right)^2 + \\sum_{j\\ge 2}\\left(\\mathrm{ES}_j\\sqrt{\\tfrac{LH_j - LH_{j-1}}{T}}\\right)^2}$$'}</Eq>
                <p>

                    vuelve a aportar en cada uno, con el peso de lo que ese tramo añade sobre el
                    anterior. Un factor a 120 días aporta en los cinco sumandos; uno a 10 días, solo
                    en el primero.
                </p>

                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `tr-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                Teoría del Riesgo
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg tr-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.unidad}</p>
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Python · R</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full tr-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white tr-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="prose-tr animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white tr-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="tr-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            Medir es fácil; defender el supuesto es el oficio.
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · Teoría del Riesgo
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            Material de aprendizaje autónomo. Casos contextualizados al mercado financiero colombiano.
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
