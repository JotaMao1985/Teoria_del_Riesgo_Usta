                            { texto: 'Porque la paridad put-call obliga a que las dos versiones de la call coincidan siempre que la put americana y la europea difieran exactamente en la prima de ejercicio anticipado.', correcta: false },
                        ],
                    },
                    {
                        pregunta: 'La put americana de este contrato vale 177,5030 y la europea 171,2770, y la frontera de ejercicio está en 1 243,0910. ¿Qué dice esa frontera?',
                        justificacion: 'Que si Ecopetrol cae hasta ahí —un 30,24 % por debajo del contado— conviene ejercer en el acto en vez de esperar a junio. La razón es la contraria a la de la call: ejercer una put adelanta el cobro de K, que empieza a rentar, y como el precio no puede bajar de cero lo que queda por ganar esperando está acotado. Esos 6,2261 pesos de diferencia son 839 millones sobre la posición del fondo.',
                        opciones: [
                            { texto: 'Que por debajo de ese precio conviene cobrar K ya en vez de esperar a junio.', correcta: true },
                            { texto: 'Que por debajo de ese precio la put europea deja de tener valor temporal positivo y su precio coincide exactamente con el valor intrínseco del contrato en esa misma fecha.', correcta: false },
                            { texto: 'Que ese es el precio de ejercicio que habría que haber elegido para que las dos versiones del contrato, la americana y la europea, tuvieran el mismo valor hoy.', correcta: false },
                            { texto: 'Que la probabilidad de que la acción llegue a ese nivel antes del vencimiento es lo que explica la prima de 6,2261 pesos entre las dos versiones del contrato.', correcta: false },
                        ],
                    },
                    {
                        pregunta: 'El comité tiene que elegir entre vender el forward a 1 843,3151 y comprar la put con K = 1 800. ¿Cuál es la pregunta que decide?',
                        justificacion: 'El capítulo la reduce a un número: las dos coberturas se cruzan en 2 020,4854, un 13,38 % por encima del contado. Por debajo de ahí el forward deja más, porque no cuesta prima; por encima gana la put, porque conserva la subida. Así que la decisión no es técnica sino de apetito: cuánta probabilidad le da el comité a una subida de más del 13,38 % en seis meses. Esa pregunta es de ellos, y el modelo no la puede contestar.',
                        opciones: [
                            { texto: 'Cuánta probabilidad le dan a que Ecopetrol suba más del 13,38 % en seis meses.', correcta: true },
                            { texto: 'Cuál de los dos instrumentos tiene menor riesgo de contraparte, dado que el forward es bilateral y la opción también se negociaría fuera de bolsa en el mercado colombiano.', correcta: false },
                            { texto: 'Cuál de las dos coberturas resulta más barata de montar hoy, comparando la prima de la put con el desembolso inicial que exige la venta del forward a seis meses.', correcta: false },
                            { texto: 'Cuál de las dos protege mejor frente a una caída fuerte del precio, que es el riesgo que el comité declaró querer cubrir cuando aprobó la operación en primer lugar.', correcta: false },
                        ],
                    },
                ]} />

                <Ejercicio tipo="R7">
                    <Reto titulo="R7 · La cotización que se firma"
                        solucion={<>
                            <p>
                                Una cotización defendible dice seis cosas.{' '}
                                <strong>Qué se cotiza</strong>: una put europea sobre{' '}
                                {dec(ACC / 1e6, 4)} millones de acciones de Ecopetrol, K = {miles(K)},
                                vencimiento 30 de junio, liquidación en efectivo.{' '}
                                <strong>Cuánto</strong>: {dec(OPC.P, 4)} por acción,{' '}
                                {miles(OPC.costoMill)} millones, el {dec(OPC.pctPos, 2)} % de la posición
                                cubierta. <strong>Con qué se calculó</strong>: árbol binomial de 500 pasos,
                                σ = {dec(SIGMA * 100, 4)} % estimada sobre las 1 916 ruedas del panel
                                congelado, r = ln(1,07) = {dec(RF * 100, 4)} % y{' '}
                                <strong>q = 0,00 % declarado</strong>, porque el panel no trae calendario
                                de dividendos.
                            </p>
                            <p>
                                <strong>Con qué rango</strong>: con la ventana de 250 ruedas la misma put
                                cuesta {dec(VENTANAS[0][3], 4)}, o sea {miles(VENT_MILL)} millones más; y
                                el precio del árbol oscila con el número de pasos, así que la cifra se
                                reporta promediando varios n y no con el n que salió primero.{' '}
                                <strong>Qué se comprobó</strong>: la paridad put-call, que da{' '}
                                {dec(OPC.paridad, 4)} y no depende del modelo — es lo único de la
                                cotización que no se apoya en el árbol—.{' '}
                                <strong>Y qué no cubre</strong>: no hay riesgo de contraparte, ni costo de
                                liquidez, ni margen; y si el comité pidiera la versión americana, el mismo
                                contrato costaría {dec(AMER.Pa, 4)} —{miles(AMER.mill)} millones más—,
                                cifra que <em>no</em> se puede obtener por paridad.
                            </p>
                            <p>
                                La frase que no puede faltar: <strong>este precio no es un pronóstico
                                sobre Ecopetrol</strong>. Si alguien en la sala pregunta «¿y ustedes creen
                                que va a subir?», la respuesta correcta es que la cotización sería la
                                misma si creyeran lo contrario, y que la tabla de la sección 4 lo
                                demuestra con cinco derivas distintas.
                            </p>
                        </>}>
                        <p>
                            La tesorería pidió cotizar la put que cubre la posición del fondo en Ecopetrol
                            y quiere <strong>una página</strong> para llevarla al comité de inversiones.
                            Escríbala. Tiene que decir qué se cotiza, cuánto vale en pesos y en porcentaje
                            de la posición, con qué parámetros se calculó y cuáles de ellos son decisiones
                            declaradas y no estimaciones, qué rango produce la principal de esas
                            decisiones, qué comprobación independiente se le hizo al número, y qué queda
                            fuera.
                        </p>
                        <p>
                            Si la nota no contiene una frase que diga explícitamente que el precio no
                            depende de lo que el área crea que va a pasar con la acción, todavía no está
                            terminada — es la confusión que este capítulo existe para deshacer, y la que
                            vuelve en cuanto nadie la nombra.
                        </p>
                    </Reto>
                </Ejercicio>

                <Box type="info" label="Antes de cerrar el capítulo">
                    Las quince preguntas y ejercicios de este capítulo se pueden responder con lo que
                    imprimen sus seis bloques y lo que devuelven sus dos laboratorios. Si alguna cifra de
                    la prosa no le cuadra con la del bloque, el bloque manda: es el que se ejecuta en cada
                    auditoría del material, en Python y en R, y compara su salida con la que aquí está
                    escrita.
                </Box>
            </>
        );

        /* ============================================================
           CURRÍCULO
        ============================================================ */
        const curriculum = [
            { id: 'portada', title: 'Portada y objetivos', icon: 'BookOpen', component: PortadaSection },
            { id: 'sec1', title: '1. Forwards y futuros: el precio sin probabilidades', icon: 'ArrowDownUp', component: Seccion1 },
            { id: 'sec2', title: '2. Opciones: perfiles de pago y paridad put-call', icon: 'Scale', component: Seccion2 },
            { id: 'sec3', title: '3. Valoración binomial por replicación', icon: 'Workflow', component: Seccion3 },
            { id: 'sec4', title: '4. La probabilidad neutral al riesgo', icon: 'Binary', component: Seccion4 },
            { id: 'sec5', title: '5. Árbol de n períodos y convergencia', icon: 'GitBranch', component: Seccion5 },
            { id: 'sec6', title: '6. Americanas y ejercicio anticipado', icon: 'Clock', component: Seccion6 },
            { id: 'eval', title: 'Evaluación', icon: 'HelpCircle', component: EvaluacionSection },
        ];

        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            // El `<head>` NO lo estampa `migrar.py`, así que un capítulo nacido
            // de copiar `tr-base.html` arrastra su título y su descripción sin
            // que nada avise: la pestaña del navegador dice «Plantilla base» y
            // eso es lo que ve quien tiene quince capítulos abiertos, y lo que
            // indexa GitHub Pages. Se derivan de `CONFIG`, que sí es lo primero
            // que cambia todo capítulo, para que ninguno pueda olvidarlo.
            useEffect(() => {
                document.title = `Cap. ${CONFIG.numero} · ${CONFIG.titulo} — Teoría del Riesgo`;
                const meta = document.querySelector('meta[name="description"]');
                if (meta) meta.setAttribute('content',
                    `${CONFIG.titulo}. ${CONFIG.subtitulo} · ${CONFIG.unidad} · `
                    + `Teoría del Riesgo, Universidad Santo Tomás.`);
            }, []);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 tr-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col tr-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `tr-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                Teoría del Riesgo
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg tr-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.unidad}</p>
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Python · R</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full tr-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white tr-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="prose-tr animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white tr-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="tr-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            Medir es fácil; defender el supuesto es el oficio.
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · Teoría del Riesgo
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            Material de aprendizaje autónomo. Casos contextualizados al mercado financiero colombiano.
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
