                    {nota && <p className="text-xs text-gray-500 italic" style={{ margin: '0.6rem 0 0' }}>{nota}</p>}
                </div>
            );
        };

        /* ============================================================
           TABLA DE RESULTADOS DE UN MODELO
           La salida de un `arch_model` o las métricas de un scorecard son
           el OBJETO DE ESTUDIO, no decoración. Una celda puede traer su
           lectura: `{ v: '0.089', lee: 'Reacción a la sorpresa de ayer…' }`.
           Las celdas con lectura se subrayan y, al pulsarlas, la muestran
           debajo. Se eligió un panel y no un tooltip porque las lecturas
           son de dos o tres líneas y un tooltip de ese tamaño es
           inutilizable en un teléfono.
        ============================================================ */
        const TablaResultados = ({ titulo, subtitulo, columnas, filas, nota }) => {
            const [activa, setActiva] = useState(null);
            const leeDe = (c) => (c && typeof c === 'object' && !React.isValidElement(c)) ? c : null;
            const valorDe = (c) => { const o = leeDe(c); return o ? o.v : c; };

            const sel = activa && filas[activa[0]] ? leeDe(filas[activa[0]].celdas[activa[1]]) : null;

            return (
                <div className="my-5">
                    {titulo && (
                        <div className="flex items-baseline gap-2 mb-2">
                            <i className="fas fa-table-list text-secondary"></i>
                            <span className="text-sm font-bold text-navy">{titulo}</span>
                            {subtitulo && <span className="text-xs text-gray-500 italic">{subtitulo}</span>}
                        </div>
                    )}
                    <div className="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
                        <table className="tabla-componente w-full text-sm bg-white" style={{ borderCollapse: 'collapse' }}>
                            <thead>
                                <tr style={{ background: '#001A4D' }}>
                                    {columnas.map((c, i) => (
                                        <th key={i} className="text-white text-left px-3 py-2 text-[0.78rem] font-semibold whitespace-nowrap">{c}</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {filas.map((f, i) => (
                                    <tr key={i} className={i % 2 ? 'bg-gray-50/60' : ''}>
                                        {f.celdas.map((c, j) => {
                                            const o = leeDe(c);
                                            const esta = activa && activa[0] === i && activa[1] === j;
                                            return (
                                                <td key={j} className="px-3 py-1.5 border-t border-gray-100 whitespace-nowrap"
                                                    style={{ fontFamily: j ? "'Fira Code', monospace" : undefined }}>
                                                    {o ? (
                                                        <button onClick={() => setActiva(esta ? null : [i, j])}
                                                            className={`text-left rounded px-1 -mx-1 transition-colors ${esta ? 'tr-gradient text-white' : 'text-primary hover:bg-primary/10'}`}
                                                            style={{ textDecoration: esta ? 'none' : 'underline dotted', textUnderlineOffset: '3px' }}>
                                                            {o.v}
                                                        </button>
                                                    ) : <span className="text-gray-700">{valorDe(c)}</span>}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {sel ? (
                        <div className="mt-2 rounded-xl border-l-4 px-3 py-2 animate-fade-in" style={{ borderColor: '#ED1E79', background: '#FDF2F8' }}>
                            <p className="text-[0.88rem] text-gray-700" style={{ margin: 0 }}>
                                <i className="fas fa-magnifying-glass-chart text-secondary mr-2"></i>{sel.lee}
                            </p>

                    ) : (
                        <p className="text-xs text-gray-400 italic mt-1.5" style={{ margin: '0.35rem 0 0' }}>
                            <i className="fas fa-hand-pointer mr-1"></i>Las cifras subrayadas explican qué dicen.
                        </p>
                    )}
                    {nota && <p className="text-xs text-gray-500 italic mt-1">{nota}</p>}
                </div>
            );
        };

        /* ============================================================
           R9 · LABORATORIO PARAMETRIZADO
           Deslizadores que recalculan la gráfica en el navegador. Es lo que
           justifica que el material sea HTML y no un PDF: mover α y ver
           moverse la cola enseña en tres segundos lo que un párrafo no.

           RESTRICCIÓN, y hay que respetarla: el cálculo ocurre aquí, en el
           navegador, así que `calcular` solo puede hacer ARITMÉTICA —un
           cuantil empírico, la recursión EWMA, la frontera de dos activos,
           la fórmula de Black-Scholes—. Ajustar un GARCH o resolver un
           programa cuadrático no cabe: eso se precomputa en Python sobre
           una malla de parámetros y se embebe; si algún control cae entre dos
           nodos, el deslizador interpola.
           `modo` declara cuál de los dos es, para que quien lea el código
           del capítulo no tenga que deducirlo.
        ============================================================ */
        const Laboratorio = ({ titulo = 'Laboratorio', enunciado, id, controles, calcular, lectura,
            altura = 'chart-h-360', modo = 'directo', nota, pregunta }) => {
            const inicial = () => Object.fromEntries(controles.map(c => [c.id, c.valor !== undefined ? c.valor : c.min]));
            const [p, setP] = useState(inicial);
            const [movido, setMovido] = useState(false);

            // La dependencia es el ESTADO SERIALIZADO, no `calcular`: el
            // capítulo la escribe como función en línea, así que su
            // identidad cambia en cada render y usarla como dependencia
            // redibujaría la gráfica sin parar.
            const firma = JSON.stringify(p);
            useEffect(() => {
                const el = document.getElementById(id);
                if (!el || !window.Plotly) return;
                const { traces, layout } = calcular(p);
                window.Plotly.react(id, traces, layout, { responsive: true, displayModeBar: false });
            }, [id, firma]);

            useEffect(() => () => {
                if (window.Plotly) { try { window.Plotly.purge(id); } catch (e) { } }
            }, [id]);

            const fijar = (cid, v) => { setMovido(true); setP(prev => ({ ...prev, [cid]: v })); };
            const reiniciar = () => { setMovido(false); setP(inicial()); };

            return (
                <div className="my-6 rounded-2xl border-2 p-5 shadow-sm" style={{ borderColor: '#DDD6FE', background: '#FBFAFF' }}>
                    <div className="flex items-center gap-2 mb-2">
                        <span className="text-white p-2 rounded-lg" style={{ background: 'linear-gradient(135deg,#7C3AED 0%,#3D008D 100%)' }}>
                            <i className="fas fa-sliders"></i>
                        </span>
                        <h4 className="text-base font-bold text-navy" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white rounded px-2 py-0.5" style={{ background: '#7C3AED' }}>R9 · Laboratorio</span>
                    </div>
                    {enunciado && <p className="text-[0.9rem] text-gray-700 mb-3" style={{ margin: '0 0 0.75rem' }}>{enunciado}</p>}

                    <div className="grid gap-3 mb-3" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(210px,1fr))' }}>
                        {controles.map(c => (
                            <label key={c.id} className="block">
                                <span className="flex items-baseline justify-between text-[0.78rem] font-semibold text-navy mb-1">
                                    <span>{c.etiqueta}</span>
                                    <span className="text-secondary" style={{ fontFamily: "'Fira Code', monospace" }}>
                                        {c.formato ? c.formato(p[c.id]) : p[c.id]}
                                    </span>
                                </span>
                                <input type="range" className="tr-range" min={c.min} max={c.max} step={c.paso}
                                    value={p[c.id]} aria-label={c.etiqueta}
                                    onChange={e => fijar(c.id, parseFloat(e.target.value))} />
                            </label>
                        ))}
                    </div>

                    <ChartFrame id={id} height={altura} />

                    {lectura && (
                        <div className="rounded-xl px-3 py-2 border-l-4" style={{ borderColor: '#7C3AED', background: '#F5F3FF' }}>
                            <p className="text-[0.88rem] text-gray-700" style={{ margin: 0 }}>
                                <i className="fas fa-eye text-purple-600 mr-2"></i>{lectura(p)}
                            </p>
                        </div>
                    )}

                    {pregunta && (
                        <p className="text-[0.88rem] text-gray-700 mt-3 font-medium" style={{ margin: '0.75rem 0 0' }}>
                            <i className="fas fa-circle-question text-secondary mr-2"></i>{pregunta}
                        </p>
                    )}

                    <div className="flex flex-wrap items-center gap-3 mt-3">
                        <button onClick={reiniciar} disabled={!movido}
                            className={`text-[0.72rem] font-semibold px-2.5 py-1 rounded-lg border transition-colors ${movido ? 'text-primary border-primary/40 hover:bg-primary/10' : 'text-gray-300 border-gray-200 cursor-default'}`}>
                            <i className="fas fa-rotate-left mr-1"></i>Valores iniciales
                        </button>
                        <span className="text-[0.68rem] text-gray-400 italic">
                            {/* «Interpola» era una afirmación de más: cuando los controles caen
                                siempre sobre un nodo —que es el caso de los laboratorios del curso—
                                no hay interpolación ninguna, y la nota del capítulo lo decía dos
                                líneas más abajo, contradiciendo a este texto fijo. */}
                            {modo === 'malla'
                                ? 'Los valores vienen de una malla precomputada en Python.'
                                : 'El cálculo se hace en el navegador con los mismos datos del capítulo.'}
                        </span>
                    </div>
                    {nota && <p className="text-xs text-gray-500 italic mt-2">{nota}</p>}
                </div>
            );
        };
        /* === TR-CORE FIN === */

        /* ============================================================
           CONFIGURACIÓN DEL CAPÍTULO
        ============================================================ */
        const CONFIG = {
            numero: '09',
            titulo: 'Bonos, tasas y curvas de rendimiento',
            subtitulo: 'El Banco publica tres tasas, el tramo de TES del fondo necesita diez, y las siete que faltan las pone un modelo',
            unidad: 'U2 · Portafolio y renta fija',
            horas: 4,
            ra: 'RA5',
            contenidoSyllabus: 'U2 · contenido 3 — Bonos, tasas de interés y curvas de rendimiento',
            temas: ['Precio de un bono', 'TIR y tasa cupón', 'Spot y forward', 'Bootstrapping', 'Nelson-Siegel', 'Curva TES'],
            nivelIA: 1,
            storageKey: 'tdr_cap09_bonos',
            docente: 'Javier Mauricio Sierra',
        };

        /* ============================================================
           DATOS DEL HILO CONDUCTOR
           El fondo de los capítulos anteriores suma aquí su tramo de renta
           fija: tres bonos de estudio con la estructura de un TES tasa fija,
           200 000 millones nominales cada uno. La curva es la del Banco de
           la República al 30/12/2025 —la misma rueda que cierra el panel de
           acciones—, reconstruida desde sus tres vértices con su propio
           modelo.

           Las cifras de abajo NO son un segundo cálculo: son las que
           imprimen los siete bloques del capítulo, copiadas con sus
           decimales. Las gráficas y los laboratorios que recalculan algo lo
           hacen con la MISMA fórmula de los bloques, en el navegador.
        ============================================================ */
        const dec = (x, n = 2) => x.toFixed(n).replace('.', ',');
        const miles = (x) => Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        const firmado = (x, n = 2) => (x < 0 ? '−' : '+') + dec(Math.abs(x), n);
        // Con signo menos tipográfico y sin «+», que es como la prosa escribe un β negativo
        const num = (x, n = 2) => (x < 0 ? '−' : '') + dec(Math.abs(x), n);
        // Una diferencia en millones, con separador de miles y signo explícito
        const firmadoMiles = (x) => { const r = Math.round(x); return r === 0 ? '0' : (r < 0 ? '−' : '+') + miles(Math.abs(r)); };
        const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const fechaTexto = (s) => `${MES[Number(s.slice(5, 7)) - 1]} de ${s.slice(0, 4)}`;

        const COL = { spot: '#3D008D', fwd: '#ED1E79', par: '#0E7490', gris: '#6B7280', ok: '#15803D', mal: '#B91C1C', am: '#B45309' };

        // Nelson-Siegel con τ fijo. Las tres cargas de un plazo m…
        const cargasNS = (m, tau) => {
            const x = m / tau;
            if (x < 1e-9) return [1, 1, 0];              // el límite en m → 0
            const f = (1 - Math.exp(-x)) / x;
            return [1, f, f - Math.exp(-x)];
        };
        // …y el sistema 3×3 que ata los tres β a los tres vértices, por Cramer:
        // es lo mismo que `np.linalg.solve` y `solve` en los bloques.
        const resolver3 = (A, y) => {
            const det = (M) => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1])
                - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0])
                + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
            const d = det(A);
            return [0, 1, 2].map(k => det(A.map((fila, i) => fila.map((v, j) => (j === k ? y[i] : v)))) / d);
        };
        const betasDe = (vert, tau) => resolver3([1, 5, 10].map(m => cargasNS(m, tau)), vert);
        const spotNS = (b, m, tau) => { const c = cargasNS(m, tau); return b[0] * c[0] + b[1] * c[1] + b[2] * c[2]; };
        const fwdNS = (b, m, tau) => b[0] + b[1] * Math.exp(-m / tau) + b[2] * (m / tau) * Math.exp(-m / tau);

        const TAU = 3.7;                                   // fijo por el Banco en los 276 meses
        const VERT = [11.30, 12.84, 13.13];                // 1, 5 y 10 años el 30/12/2025, % continuo
        const BETA = betasDe(VERT, TAU);                   // 12,1974 · −1,7346 · 5,5050
        const BETA_PUB = [12, -2, 5];                      // los que publica el Banco, en % (0.12 · −0.02 · 0.05)

        // El tramo de TES del fondo: tres bonos de estudio (decisión declarada)
        const TRAMO = [{ T: 2, c: 6.00 }, { T: 5, c: 7.75 }, { T: 10, c: 7.25 }];
        const NOMINAL = 200000;                            // millones por bono
        const precioBono = (b, tau, T, cupon, desplaza = (m) => 0) => {
            let p = 0;
            for (let t = 1; t <= T; t++) p += (t < T ? cupon : cupon + 100) * Math.exp(-(spotNS(b, t, tau) + desplaza(t)) / 100 * t);
            return p;
        };
        const valorTramo = (b, tau, desplaza) => TRAMO.reduce((s, x) => s + precioBono(b, tau, x.T, x.c, desplaza) / 100 * NOMINAL, 0);

        // Bloque 1 · la curva del 30/12/2025 y el precio del tramo
        const SPOT = [11.3000, 11.9038, 12.3336, 12.6345, 12.8400, 12.9755, 13.0598, 13.1071, 13.1279, 13.1300];
        const DESC = [0.893151, 0.788144, 0.690728, 0.603277, 0.526239, 0.459082, 0.400844, 0.350440, 0.306815, 0.269012];
        const B1 = {
            precios: [88.9021, 79.7608, 65.2372], valores: [177804, 159522, 130474], total: 467800,
            principal: 26.9012, totalEA: 482287, difEA: 14486,
        };

        // Bloque 2 · la TIR, el cupón y la spot del vencimiento
        const B2 = {
            tir: [12.6202, 13.5869, 13.8845], spotEA: [12.6412, 13.7008, 14.0310],
            cupones: [[0.00, 26.9012, 14.0310], [7.25, 65.2372, 13.8845], [13.25, 96.9636, 13.8282]],
            tirC: 13.0014, promedio: 12.9999, spot10: 13.1300,
        };

        // Bloque 3 · spot y forward, y la forward contra lo que pasó
        const FWD = [11.3000, 12.5075, 13.1934, 13.5370, 13.6620, 13.6527, 13.5656, 13.4382, 13.2944, 13.1491];
        const B3 = {
            pares: 264, supera: 75.4, error: 1.2842, rmseF: 2.7341, rmseP: 2.3238,
            tramos: [[2003, 2012, 2.4089, 3.4129, 2.1852], [2013, 2019, 0.8428, 1.3868, 1.2845], [2020, 2024, -0.3474, 2.6275, 3.4496]],
        };

        // Bloque 4 · el bootstrapping, su ida y vuelta, y un precio que llega mal
        const PAR = [11.9632, 12.6008, 13.0383, 13.3339, 13.5301, 13.6574, 13.7375, 13.7855, 13.8120, 13.8242];
        const B4 = {
            idaVuelta: 0.0056,
            dSpotBoot: [0.00, 0.00, 0.00, 18.35, -2.00, -1.69, -1.47, -1.30, -1.16, -1.05],
            dFwdBoot: [0.00, 0.00, 0.00, 73.40, -83.38, -0.18, -0.13, -0.09, -0.06, -0.03],
            dSpotNS: [-0.33, 2.30, 3.49, 3.66, 3.15, 2.20, 0.96, -0.44, -1.92, -3.40],
            dFwdNS: [-0.33, 4.93, 5.86, 4.19, 1.12, -2.56, -6.48, -10.22, -13.75, -16.76],
        };

        // Bloque 5 · los β publicados contra los vértices, y la familia de τ
        const B5 = {
            recons: [10.8129, 12.3508, 12.7005], errMedio: 0.2945, errMax: 0.9263, meses05: 72, errUVR: 0.0127,

                    <h3>Una forward no es un pronóstico, y la historia lo mide</h3>

                    <Motivacion icon="fa-stairs"
                        gancho="El Banco publica la curva ya hecha; el mercado no. Una mesa que solo tiene los precios de diez bonos con cupón tiene que despejar la curva plazo por plazo, empezando por el más corto, porque cada plazo necesita todos los anteriores. Y si uno de los diez precios llega mal, el error no se queda donde cayó.">
                        El método se llama bootstrapping y es el primero que se enseña, porque no necesita
                        ningún modelo: una ecuación por bono y una incógnita por ecuación. Lo interesante no es
                        la aritmética sino lo que hace con un precio defectuoso.
                    </Motivacion>

                    <h3>Despejar la curva, un plazo a la vez</h3>
                    <p>
                        El{' '}
                        <Termino def="Método que despeja la curva cero cupón a partir de precios de bonos con cupón, plazo por plazo y del más corto al más largo: cada bono aporta una ecuación con una sola incógnita, el factor de descuento de su vencimiento.">bootstrapping</Termino>{' '}
                        (<em>bootstrapping</em>, construcción secuencial) recorre los bonos del más corto al
                        más largo. El de un año tiene un solo pago, así que su precio da el factor de
                        descuento de un año sin ayuda. El de dos años tiene dos pagos, pero el primero ya se
                        sabe descontar, y queda una sola incógnita. Y así hasta el último.
                    </p>
                    <p>
                        Como el Banco no publica precios sino tasas, la sección hace el camino al revés para
                        poder comprobarlo: arma el mercado que la curva del 30/12/2025 implica —un bono por
                        año, del 1 al 10, que cotiza <em>a la par</em>, en 100— y le pasa sus diez precios al
                        bootstrapping. El cupón de un bono a la par es la{' '}
                        <Termino def="El cupón con el que un bono de ese plazo cotizaría exactamente en 100. Es la TIR de un bono a la par, y el conjunto de las diez es la curva par.">tasa par</Termino>{' '}
                        de su plazo, y se cotiza con cuatro decimales. Si el método devuelve la curva de la
                        que salieron los precios, está bien escrito: esa ida y vuelta es la prueba que se le
                        hace a cualquier bootstrapping antes de confiarle cotizaciones de verdad.

                    <Derivacion
                        titulo="Una ecuación por bono, una incógnita por ecuación"
                        pasos={[
                            {
                                eq: <Eq>{'$$P_T = c_T \\sum_{t=1}^{T-1} d(t) + (100 + c_T)\\, d(T)$$'}</Eq>,
                                porque: 'Es la fórmula de la sección 1 separando el último pago. Al llegar al bono de T años, todos los factores de los plazos anteriores ya salieron de los bonos anteriores: la suma es un número conocido.',
                            },
                            {
                                eq: <Eq>{'$$d(T) = \\frac{P_T - c_T \\sum_{t<T} d(t)}{100 + c_T}$$'}</Eq>,
                                porque: 'Despejando la única incógnita. Aquí está todo el método, y también su debilidad: d(T) hereda cualquier error de los d(t) anteriores y del precio P_T, porque no hay otra ecuación contra la que contrastarlo.',
                            },
                            {
                                eq: <Eq>{'$$s(T) = -\\frac{\\ln d(T)}{T}$$'}</Eq>,
                                porque: 'Y de vuelta a tasa, en la convención continua declarada. Con el bono de un año: d(1) = 100/111,9632 = 0,893151 y s(1) = 11,30 %, el vértice del Banco. Que la tasa par de un año, 11,9632 %, sea justamente esa spot pasada a efectiva no es casualidad: un bono a la par de un año es un cero.',
                            },
                        ]}
                        cierre="El orden no es una preferencia de estilo: el bono de cinco años no se puede procesar antes que el de cuatro porque su ecuación tiene dos incógnitas hasta que el de cuatro la reduce a una. Es un algoritmo intrínsecamente secuencial, y el R5 de esta sección pide reconstruirlo."
                    />

                    <TablaTraza
                        titulo="R1 · Los tres primeros plazos, a mano"
                        enunciado="Complete la traza para los tres bonos a la par más cortos. Use los cupones como se muestran, con cuatro decimales; redondee cada factor de descuento a seis decimales y úselo así redondeado en la fila siguiente; y dé la tasa con cuatro decimales. Escriba con coma decimal."
                        codigo={{
                            python: `df = []
for c in cupones:                  # 11.9632, 12.6008, 13.0383
    suma = sum(df)                 # los factores que ya se conocen
    df.append((100 - c * suma) / (100 + c))
spot = [-log(d) / t * 100 for t, d in enumerate(df, start=1)]`,
                            r: `df <- c()
for (c in cupones) {               # 11.9632, 12.6008, 13.0383
  suma <- sum(df)                  # los factores que ya se conocen
  df <- c(df, (100 - c * suma) / (100 + c))
}
spot <- -log(df) / seq_along(df) * 100`,
                        }}
                        columnas={[

                        ]}
                        filas={[
                            { T: '1', c: '11,9632', suma: '0', d: '0,893151', s: '11,3000' },
                            { T: '2', c: '12,6008', suma: '0,893151', d: '0,788143', s: '11,9038' },

                        pista="La primera fila no tiene factores anteriores: la suma es cero y d(1) = 100/111,9632. En la segunda, el primer cupón de 12,6008 se descuenta con el d(1) que acaba de salir, así que d(2) = (100 − 12,6008 × 0,893151)/112,6008. La tercera suma los dos anteriores. Fíjese en el resultado: los factores caen, las tasas suben, y las tres coinciden con los vértices y la curva del Banco hasta el cuarto decimal. El d(2) de la traza termina en 3 y el de la sección 1 en 4 porque aquí el cupón viene redondeado; la tasa no se entera."
                    />

                    <CodeTabs titulo="El bootstrapping sobre los diez bonos a la par, la ida y vuelta, y un precio que llega mal" bloques={EJ_BOOTSTRAP}
                        nota="El bucle es la ecuación de la derivación, en orden. La segunda mitad repite el cálculo con el precio del bono de cuatro años 0,50 por debajo, y le pasa el resultado a Nelson-Siegel con τ fijo, que es lineal en los β y se ajusta por mínimos cuadrados en una línea." />

                    <h3>Lo que imprime el bloque, leído</h3>
                    <p>
                        La ida y vuelta funciona: la mayor diferencia entre la curva que devuelve el
                        bootstrapping y la del Banco es de <strong>{dec(B4.idaVuelta, 4)} puntos
                        básicos</strong>, medio centésimo de punto básico. No es cero porque los cupones se

                    <h3>Tres formas y un parámetro que nadie estima</h3>
                    <p>
                        El modelo de Nelson y Siegel (1987) describe toda la curva con tres formas y un

                        redondeo: en la historia vieja los parámetros y los vértices publicados no salen del

                    },
                    {
                        pregunta: 'Con τ fijo y tres vértices, el ajuste de Nelson-Siegel tiene error cero. ¿Qué dice ese cero sobre la calidad de la curva?',
                        justificacion: 'Con τ fijo, s(m) es lineal en los β y los tres vértices dan tres ecuaciones con tres incógnitas: la solución es única y exacta, así que el error es cero por construcción y no por mérito. Con τ libre ni siquiera hay solución única: la sección 5 muestra seis τ que pasan por los tres vértices, con la tasa a treinta años entre 6,74 % y 13,32 %. La calidad de una curva se mide contra datos que no se usaron para construirla, y aquí no queda ninguno.',
                        opciones: [

                        opciones: [
                            { texto: 'Que los tres bonos del tramo son intercambiables, porque si todos los plazos se mueven juntos da igual en cuál de los tres se invierta.', correcta: false },

                <Box type="info" label="Antes de cerrar el capítulo">
                    Las quince preguntas y ejercicios de este capítulo se pueden responder con lo que imprimen
                    sus siete bloques y lo que devuelven sus dos laboratorios. Si alguna cifra de la prosa no le
                    cuadra con la del bloque, el bloque manda: es el que se ejecuta en cada auditoría del
                    material, en Python y en R, y compara su salida con la que aquí está escrita.

        /* ============================================================
           CURRÍCULO
        ============================================================ */
        const curriculum = [
            { id: 'portada', title: 'Portada y objetivos', icon: 'BookOpen', component: PortadaSection },
            { id: 'sec1', title: '1. Flujo de caja de un bono y su precio', icon: 'Calculator', component: Seccion1 },
            { id: 'sec2', title: '2. TIR, tasa cupón y precio: tres cosas distintas', icon: 'Scale', component: Seccion2 },
            { id: 'sec3', title: '3. Tasas spot, forward y no arbitraje', icon: 'TrendingUp', component: Seccion3 },
            { id: 'sec4', title: '4. La curva por bootstrapping', icon: 'Layers', component: Seccion4 },
            { id: 'sec5', title: '5. Ajuste paramétrico: Nelson-Siegel', icon: 'Sliders', component: Seccion5 },
            { id: 'sec6', title: '6. La curva TES en Colombia y qué la mueve', icon: 'Activity', component: Seccion6 },
            { id: 'eval', title: 'Evaluación', icon: 'HelpCircle', component: EvaluacionSection },
        ];


        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            // El `<head>` NO lo estampa `migrar.py`, así que un capítulo nacido
            // de copiar `tr-base.html` arrastra su título y su descripción sin
            // que nada avise: la pestaña del navegador dice «Plantilla base» y
            // eso es lo que ve quien tiene quince capítulos abiertos, y lo que
            // indexa GitHub Pages. Se derivan de `CONFIG`, que sí es lo primero
            // que cambia todo capítulo, para que ninguno pueda olvidarlo.
            useEffect(() => {
                document.title = `Cap. ${CONFIG.numero} · ${CONFIG.titulo} — Teoría del Riesgo`;
                const meta = document.querySelector('meta[name="description"]');
                if (meta) meta.setAttribute('content',
                    `${CONFIG.titulo}. ${CONFIG.subtitulo} · ${CONFIG.unidad} · `
                    + `Teoría del Riesgo, Universidad Santo Tomás.`);
            }, []);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 tr-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col tr-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `tr-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                Teoría del Riesgo
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg tr-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.unidad}</p>
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Python · R</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full tr-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white tr-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="prose-tr animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white tr-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="tr-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            Medir es fácil; defender el supuesto es el oficio.
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · Teoría del Riesgo
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            Material de aprendizaje autónomo. Casos contextualizados al mercado financiero colombiano.
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
