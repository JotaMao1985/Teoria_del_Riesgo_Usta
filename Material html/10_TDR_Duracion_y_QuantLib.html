                            <div className="space-y-1.5 min-h-[60px] rounded-xl border-2 border-dashed border-gray-200 p-2">
                                {disponibles.map(i => (
                                    <button key={i} onClick={() => agregar(i)} disabled={comprobado}
                                        className="w-full text-left px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 hover:border-secondary hover:bg-amber-50 text-[0.88rem] text-gray-700 font-mono transition-all flex items-center gap-2">
                                        <i className="fas fa-plus text-secondary text-xs flex-shrink-0"></i>
                                        <span className="flex-1">{pasosAct[i]}</span>
                                    </button>
                                ))}
                                {!disponibles.length && <p className="text-xs text-gray-400 italic text-center py-3" style={{ margin: 0 }}>Todos los pasos están en la secuencia</p>}
                            </div>
                        </div>

                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                                Su secuencia ({secuencia.length}/{pasosAct.length})
                            </div>
                            <div className="space-y-1.5 min-h-[60px] rounded-xl border-2 border-dashed p-2" style={{ borderColor: '#ED1E79' }}>
                                {secuencia.map((i, pos) => {
                                    let cls = 'border-gray-200 bg-white';
                                    if (comprobado) cls = posOk(pos) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    return (
                                        <button key={pos} onClick={() => quitar(pos)} disabled={comprobado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 font-mono transition-all flex items-center gap-2 ${cls}`}>
                                            <span className="flex-shrink-0 w-5 h-5 rounded-full tr-gradient text-white flex items-center justify-center text-[0.7rem] font-bold">{pos + 1}</span>
                                            <span className="flex-1">{pasosAct[i]}</span>
                                            {comprobado
                                                ? <i className={`fas ${posOk(pos) ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs flex-shrink-0`}></i>
                                                : <i className="fas fa-xmark text-gray-300 text-xs flex-shrink-0"></i>}
                                        </button>
                                    );
                                })}
                                {!secuencia.length && <p className="text-xs text-gray-400 italic text-center py-3" style={{ margin: 0 }}>Haga clic en los pasos de la izquierda, en el orden correcto</p>}
                            </div>
                        </div>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => completo && setComprobado(true)} disabled={!completo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white tr-gradient disabled:opacity-40">
                                <i className="fas fa-flag-checkered mr-1"></i>Comprobar orden
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setSecuencia([]); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className={`text-sm font-bold ${todoOk ? 'text-green-600' : 'text-red-500'}`}>
                                    <i className={`fas ${todoOk ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                    {todoOk ? '¡Secuencia correcta!' : `${aciertos} de ${pasosAct.length} pasos en la posición correcta`}
                                </span>
                            </>}
                    </div>
                    {comprobado && !todoOk && (
                        <div className="mt-3 animate-fade-in">
                            <Box type="tip" label="Orden correcto">
                                <ol className="text-sm" style={{ listStyle: 'decimal', paddingLeft: '1.4rem', margin: 0 }}>
                                    {pasosAct.map((p, i) => <li key={i} className="font-mono text-[0.85rem]">{p}</li>)}
                                </ol>
                            </Box>
                        </div>
                    )}
                    {pista && <p className="text-xs text-gray-500 italic mt-2"><i className="fas fa-lightbulb mr-1 text-secondary"></i>{pista}</p>}
                </div>
            );
        };

        /* ============================================================
           R6 · EMPAREJAMIENTO
           solucion[i] = índice en `derecha` que corresponde a izquierda[i]
        ============================================================ */
        const PALETA_PARES = ['#3D008D', '#ED1E79', '#0E7490', '#B91C1C', '#15803D', '#B45309', '#001A4D', '#7C3AED'];

        const Emparejamiento = ({ titulo = 'Empareje cada elemento con su correspondencia', enunciado, izquierda, derecha, solucion, lang = LANG_DEFECTO, etiquetaIzq = 'Concepto', etiquetaDer = 'Corresponde a' }) => {
            // El lado izquierdo suele ser codigo y por tanto cambia con el
            // lenguaje; el derecho son significados y no cambia.
            const idiomas = lenguajesDe(izquierda);
            const langs = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(langs, lang);
            const izqAct = porLenguaje(izquierda, langActivo);

            const [pares, setPares] = useState({});
            const [selIzq, setSelIzq] = useState(null);
            const [comprobado, setComprobado] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [comprobado]);
            useEffect(() => { setPares({}); setSelIzq(null); setComprobado(false); }, [langActivo]);

            const derUsada = (j) => Object.values(pares).includes(j);
            const izqDe = (j) => Object.keys(pares).find(i => pares[i] === j);

            const clicIzq = (i) => {
                if (comprobado) return;
                if (pares[i] !== undefined) { setPares(p => { const n = { ...p }; delete n[i]; return n; }); setSelIzq(null); return; }
                setSelIzq(selIzq === i ? null : i);
            };
            const clicDer = (j) => {
                if (comprobado) return;
                if (derUsada(j)) { const i = izqDe(j); setPares(p => { const n = { ...p }; delete n[i]; return n; }); return; }
                if (selIzq === null) return;
                setPares(p => ({ ...p, [selIzq]: j }));
                setSelIzq(null);
            };

            const completo = Object.keys(pares).length === izqAct.length;
            const parOk = (i) => pares[i] === solucion[i];
            const aciertos = izqAct.map((_, i) => parOk(i)).filter(Boolean).length;
            const todoOk = aciertos === izqAct.length;

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="tr-gradient text-white p-2 rounded-lg"><i className="fas fa-link"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-primary/80 rounded px-2 py-0.5">R6 · Emparejar</span>
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-2">{enunciado}</div>}
                    <SelectorLenguaje disponibles={langs} activo={langActivo} onCambiar={cambiarLang} />
                    <p className="text-xs text-gray-500 mb-3">
                        <i className="fas fa-hand-pointer mr-1"></i>
                        Haga clic en un elemento de la izquierda y luego en su pareja de la derecha. Para deshacer, haga clic sobre cualquiera de los dos.
                    </p>

                    <div className="grid md:grid-cols-2 gap-4">
                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">{etiquetaIzq}</div>
                            <div className="space-y-1.5">
                                {izqAct.map((t, i) => {
                                    const emparejado = pares[i] !== undefined;
                                    const color = emparejado ? PALETA_PARES[pares[i] % PALETA_PARES.length] : null;
                                    let cls = 'border-gray-200 bg-white hover:border-primary/40';
                                    if (comprobado && emparejado) cls = parOk(i) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    else if (selIzq === i) cls = 'border-secondary bg-amber-50 ring-2 ring-secondary/30';
                                    return (
                                        <button key={i} onClick={() => clicIzq(i)} disabled={comprobado}
                                            aria-pressed={selIzq === i}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 transition-all flex items-start gap-2 ${cls}`}>
                                            <span className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[0.7rem] font-bold text-white mt-0.5"
                                                style={{ background: color || '#CBD5E1' }}>
                                                {emparejado ? pares[i] + 1 : i + 1}
                                            </span>
                                            <span className="flex-1">{t}</span>
                                            {comprobado && emparejado && <i className={`fas ${parOk(i) ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs mt-1`}></i>}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">{etiquetaDer}</div>
                            <div className="space-y-1.5">
                                {derecha.map((t, j) => {
                                    const usada = derUsada(j);
                                    const color = usada ? PALETA_PARES[j % PALETA_PARES.length] : null;
                                    let cls = 'border-gray-200 bg-white hover:border-primary/40';
                                    if (usada) cls = 'border-gray-300 bg-gray-50';
                                    if (comprobado && usada) {
                                        const i = Number(izqDe(j));
                                        cls = parOk(i) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    }
                                    return (
                                        <button key={j} onClick={() => clicDer(j)} disabled={comprobado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 transition-all flex items-start gap-2 ${cls}`}>
                                            <span className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[0.7rem] font-bold text-white mt-0.5"
                                                style={{ background: color || '#CBD5E1' }}>
                                                {String.fromCharCode(65 + j)}
                                            </span>
                                            <span className="flex-1">{t}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => completo && setComprobado(true)} disabled={!completo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white tr-gradient disabled:opacity-40">
                                <i className="fas fa-check-double mr-1"></i>Comprobar ({Object.keys(pares).length}/{izqAct.length})
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setPares({}); setSelIzq(null); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className={`text-sm font-bold ${todoOk ? 'text-green-600' : 'text-red-500'}`}>
                                    <i className={`fas ${todoOk ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                    {aciertos} de {izqAct.length} correctos
                                </span>
                            </>}
                    </div>
                    {comprobado && !todoOk && (
                        <div className="mt-3 animate-fade-in">
                            <Box type="tip" label="Emparejamiento correcto">
                                <ul className="text-sm" style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                                    {izqAct.map((t, i) => (
                                        <li key={i} className="mb-1">
                                            <strong>{i + 1}</strong> → <strong>{String.fromCharCode(65 + solucion[i])}</strong>
                                            <span className="text-gray-500"> · {derecha[solucion[i]]}</span>
                                        </li>
                                    ))}
                                </ul>
                            </Box>
                        </div>
                    )}
                </div>
            );
        };

        /* ============================================================
           TAXONOMÍA DE ERRORES DEL DOMINIO — la clave de R3
           Se define UNA vez aquí y los capítulos la reutilizan, en vez de
           inventar una lista por ejercicio. Dos motivos: el estudiante
           aprende a clasificar con el mismo vocabulario en los quince
           capítulos, y los distractores dejan de delatar la respuesta —si
           cada ejercicio trae sus propias opciones, la que «suena» al tema
           del capítulo es casi siempre la correcta—.

           Un ejercicio pasa `tipos={TIPOS_ERROR_RIESGO}` y `tipoCorrecto`
           con el índice; usar `IDX_ERROR` en vez del número hace el JSX
           legible y sobrevive a un reordenamiento de la lista.
        ============================================================ */
        const TIPOS_ERROR_RIESGO = [
            'Supuesto no verificado — se aplica una fórmula cuya condición nadie comprobó',
            'Confusión de medida — se calcula una magnitud y se reporta como si fuera otra',
            'Fuga de información — el cálculo usa datos que en el momento de decidir no existían',
            'Convención equivocada — base de conteo, calendario, periodicidad o unidad que no es la del instrumento',
            'Estimador inconsistente — el estadístico no corresponde al parámetro que el modelo necesita',
            'Resultado sin incertidumbre — se reporta un número simulado o estimado sin su error',
            'Interpretación indebida — el número está bien y la conclusión que se saca de él no',
        ];

        const IDX_ERROR = {
            supuesto: 0, medida: 1, fuga: 2, convencion: 3,
            estimador: 4, incertidumbre: 5, interpretacion: 6,
        };

        /* ============================================================
           NIVEL DE USO DE IA (AI Assessment Scale)
           El syllabus se compromete con niveles declarados. El material de
           estudio no es un instrumento calificado, así que el nivel se
           declara por TIPO DE EJERCICIO —donde la distinción tiene
           consecuencias— y el capítulo muestra además el del instrumento
           que prepara.
        ============================================================ */
        const AIAS = {
            1: { nombre: 'No AI', color: '#B91C1C', icon: 'fa-ban', que: 'Se resuelve sin asistencia de IA.' },
            2: { nombre: 'AI Planning', color: '#B45309', icon: 'fa-lightbulb', que: 'La IA ayuda a explorar y planear; el resultado y su defensa son suyos.' },
            3: { nombre: 'AI Collaboration', color: '#0E7490', icon: 'fa-handshake-angle', que: 'La IA participa en el desarrollo y usted la verifica, con bitácora de prompts.' },
            4: { nombre: 'Full AI', color: '#15803D', icon: 'fa-robot', que: 'La IA ejecuta y usted dirige y evalúa el resultado.' },
            5: { nombre: 'AI Exploration', color: '#7C3AED', icon: 'fa-flask', que: 'Uso creativo y exploratorio de la IA como coautora.' },
        };

        const NivelIA = ({ nivel = 1, nota, compacto = false }) => {
            const a = AIAS[nivel] || AIAS[1];
            if (compacto) {
                return (
                    <span className="inline-flex items-center gap-1.5 text-[0.65rem] uppercase tracking-wider font-bold text-white rounded px-2 py-0.5 align-middle"
                        style={{ background: a.color }} title={a.que}>
                        <i className={`fas ${a.icon} text-[0.6rem]`}></i>{`IA ${nivel} · ${a.nombre}`}
                    </span>
                );
            }
            return (
                <div className="my-4 flex items-start gap-3 rounded-xl border p-3 bg-white" style={{ borderColor: a.color + '55' }}>
                    <span className="flex-shrink-0 text-white rounded-lg px-2.5 py-2 text-center" style={{ background: a.color }}>
                        <i className={`fas ${a.icon}`}></i>
                        <span className="block text-[0.6rem] font-bold mt-0.5">{`NIVEL ${nivel}`}</span>
                    </span>
                    <div className="min-w-0">
                        <p className="text-sm font-bold text-navy" style={{ margin: 0 }}>
                            {`Uso de IA · ${a.nombre}`}
                            <span className="ml-2 text-[0.65rem] font-semibold text-gray-400 uppercase tracking-wider">AI Assessment Scale</span>
                        </p>
                        <p className="text-[0.85rem] text-gray-600 mt-0.5" style={{ margin: '0.15rem 0 0' }}>{a.que}</p>
                        {nota && <p className="text-xs text-gray-500 italic mt-1" style={{ margin: '0.35rem 0 0' }}>{nota}</p>}
                    </div>
                </div>
            );
        };

        /* ============================================================
           FICHA NORMATIVA
           Basilea III, FRTB y los cuatro sistemas de la Superfinanciera
           aparecen en las tres unidades. Un `Box` genérico no deja ver lo
           que aquí importa: qué exige la norma y QUÉ CÁLCULO DEL CAPÍTULO
           la satisface. Sin esa segunda línea la regulación se lee como
           contexto decorativo, que es justo como se olvida.
        ============================================================ */
        const FichaNorma = ({ norma, emisor, referencia, exige, enElCapitulo, enlace, children }) => (
            <div className="my-5 rounded-2xl border-2 overflow-hidden shadow-sm" style={{ borderColor: '#001A4D22' }}>
                <div className="px-4 py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1" style={{ background: '#001A4D' }}>
                    {/* contraste-ok: el gold va sobre el navy de la cabecera, no sobre el fondo claro */}
                    <i className="fas fa-scale-balanced text-gold"></i>
                    <span className="text-white font-bold text-[0.95rem]">{norma}</span>
                    {emisor && <span className="text-[0.65rem] uppercase tracking-widest text-gray-300 font-semibold">{emisor}</span>}
                    {referencia && <span className="ml-auto text-[0.7rem] text-gray-300 font-mono">{referencia}</span>}
                </div>
                <div className="bg-white px-4 py-3 space-y-2.5">
                    <div>
                        <p className="text-[0.65rem] uppercase tracking-wider font-bold text-gray-400" style={{ margin: 0 }}>Qué exige</p>
                        <p className="text-[0.9rem] text-gray-700" style={{ margin: '0.15rem 0 0' }}>{exige}</p>
                    </div>
                    <div className="rounded-lg px-3 py-2" style={{ background: '#F5F0FB' }}>
                        <p className="text-[0.65rem] uppercase tracking-wider font-bold text-primary" style={{ margin: 0 }}>
                            <i className="fas fa-link mr-1"></i>Qué cálculo de este capítulo la satisface
                        </p>
                        <p className="text-[0.9rem] text-gray-700" style={{ margin: '0.15rem 0 0' }}>{enElCapitulo}</p>
                    </div>
                    {children}
                    {enlace && (
                        <p className="text-xs" style={{ margin: '0.5rem 0 0' }}>
                            <a href={enlace} target="_blank" rel="noopener noreferrer" className="text-teal font-semibold hover:underline">
                                <i className="fas fa-arrow-up-right-from-square mr-1"></i>Texto de la norma
                            </a>
                        </p>
                    )}
                </div>
            </div>
        );

        /* ============================================================
           DERIVACIÓN PASO A PASO
           `Eq` muestra una fórmula terminada. Este curso vive de las
           derivaciones —de la binomial a Black-Scholes hay ocho pasos y
           cada uno tiene un porqué—, y una cadena de fórmulas sin
           justificación se lee como un acto de fe.

           El paso siempre se ve; el porqué se pliega. Así quien ya lo sabe
           recorre la cadena de un vistazo y quien no, la abre.
        ============================================================ */
        const Derivacion = ({ titulo = 'Derivación', pasos, cierre }) => {
            const [abiertos, setAbiertos] = useState(() => new Set());
            const ref = useRef(null);
            useTypeset(ref, [pasos, abiertos]);

            const alternar = (i) => setAbiertos(prev => {
                const s = new Set(prev);
                s.has(i) ? s.delete(i) : s.add(i);
                return s;
            });
            const todos = () => setAbiertos(prev => prev.size === pasos.length ? new Set() : new Set(pasos.map((_, i) => i)));

            return (
                <div ref={ref} className="my-6 rounded-2xl border p-4 bg-white shadow-sm" style={{ borderColor: '#3D008D22' }}>
                    <div className="flex items-center gap-2 mb-3">
                        <span className="text-white p-2 rounded-lg tr-gradient"><i className="fas fa-square-root-variable"></i></span>
                        <h4 className="text-base font-bold text-navy" style={{ margin: 0 }}>{titulo}</h4>
                        <button onClick={todos}
                            className="ml-auto text-[0.7rem] font-semibold text-primary hover:text-secondary transition-colors">
                            {abiertos.size === pasos.length ? 'Plegar los porqués' : 'Ver todos los porqués'}
                        </button>
                    </div>
                    <ol className="space-y-2" style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                        {pasos.map((p, i) => {
                            const abierto = abiertos.has(i);
                            return (
                                <li key={i} className="rounded-xl border" style={{ borderColor: abierto ? '#ED1E7955' : '#E5E7EB' }}>
                                    {/* El número y el botón van en una fila propia y la fórmula
                                        debajo, a todo el ancho de la tarjeta. Cuando los tres
                                        compartían fila, el botón le quitaba unos 90 px a la
                                        ecuación en TODA anchura: a 1024 px la dejaba en 447 y a
                                        375 px en 134, que es donde el paso 5 de la sección 1 del
                                        capítulo 7 mostraba `ρᵢⱼ = 1 para t…` y nada más. Cuesta
                                        una línea corta por paso y devuelve la tarjeta entera. */}
                                    <div className="flex items-center gap-2 px-3 pt-2">
                                        <span className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[0.7rem] font-bold text-white tr-gradient">
                                            {i + 1}
                                        </span>
                                        <button onClick={() => alternar(i)} aria-expanded={abierto}
                                            className="ml-auto flex-shrink-0 text-[0.7rem] font-semibold px-2 py-1 rounded-lg border border-gray-200 text-gray-500 hover:text-primary hover:border-primary/40 transition-colors">
                                            <i className={`fas fa-chevron-down mr-1 transition-transform duration-200 ${abierto ? 'rotate-180' : ''}`}></i>
                                            porqué
                                        </button>
                                    </div>
                                    <div className="px-3 pb-2">
                                        {/* `Eq` YA trae su propia caja con `eq-fit` y `eq-scroll`.
                                            Envolverla en otra igual anidaba dos contenedores con
                                            desbordamiento: el de fuera tapaba al de dentro, así que
                                            medir el de fuera devolvía siempre «cabe» y la sombra se
                                            pintaba dos veces. Aquí solo se normaliza el tipo, como
                                            hace `Anatomia` con el suyo. */}
                                        {typeof p.eq === 'string' ? <Eq>{p.eq}</Eq> : p.eq}
                                    </div>
                                    {abierto && (
                                        <div className="px-3 pb-3 animate-fade-in">
                                            <p className="text-[0.88rem] text-gray-600 border-l-2 pl-3" style={{ borderColor: '#ED1E79', margin: 0 }}>
                                                {p.porque}
                                            </p>
                                        </div>
                                    )}
                                </li>
                            );
                        })}
                    </ol>
                    {cierre && (
                        <p className="text-[0.88rem] text-gray-700 mt-3 rounded-lg px-3 py-2" style={{ background: '#F5F0FB', margin: '0.75rem 0 0' }}>
                            <i className="fas fa-flag-checkered text-primary mr-2"></i>{cierre}
                        </p>
                    )}
                </div>
            );
        };

        /* ============================================================
           ANATOMÍA DE UNA FÓRMULA
           `Eq` muestra la fórmula y `Derivacion` cuenta de dónde sale.
           Faltaba la tercera pregunta, que es la que el estudiante hace
           primero: QUÉ ES CADA PIEZA y CUÁNTO VALE AQUÍ.

           Tres campos por pieza —símbolo, qué es, cuánto vale— y el
           tercero es el que hace el trabajo: ata la letra a una cifra del
           capítulo, que es lo que convierte una fórmula en un enunciado
           sobre este fondo y no sobre un fondo cualquiera. Es opcional,
           porque no toda letra tiene número (S sí, w no).

           NO se pliega, a diferencia de `Derivacion`. Allí el porqué es
           una profundización que quien ya la sabe se salta; aquí la
           lectura ES el contenido, y esconderla dejaría el componente
           mostrando lo mismo que un `Eq` a secas.

           Y llama a `useTypeset`: `TablaResultados` no lo hace, y por eso
           no sirve de glosario aunque su forma de tabla lo pareciera. El
           símbolo se escribe en línea —`\\(\\zeta\\)`—, que es el
           delimitador que `tr-head.html` configura.
        ============================================================ */
        const Anatomia = ({ titulo = 'Anatomía de la fórmula',
            subtitulo = 'Cada pieza, qué hace y cuánto vale en este capítulo.',
            eq, piezas, nota }) => {
            const ref = useRef(null);
            useTypeset(ref, [eq, piezas]);

            return (
                <div ref={ref} className="my-6 rounded-2xl border p-4 bg-white shadow-sm" style={{ borderColor: '#ED1E7933' }}>
                    <div className="flex items-baseline gap-2 mb-1">
                        <span className="text-white px-2 py-1 rounded-lg tr-gradient text-xs"><i className="fas fa-magnifying-glass-plus"></i></span>
                        <h4 className="text-base font-bold text-navy" style={{ margin: 0 }}>{titulo}</h4>
                    </div>
                    {subtitulo && <p className="text-xs text-gray-500 italic mb-2" style={{ margin: '0 0 0.6rem' }}>{subtitulo}</p>}
                    {eq && (typeof eq === 'string' ? <Eq>{eq}</Eq> : eq)}
                    <ul className="space-y-2" style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                        {piezas.map((p, i) => (
                            <li key={i} className="flex flex-wrap items-center gap-x-3 gap-y-2 rounded-xl border border-gray-200 px-3 py-2">
                                <span className="flex-shrink-0 rounded-lg px-2 py-1 text-center"
                                    style={{ background: '#F5F0FB', color: '#3D008D', minWidth: '3.25rem' }}>
                                    {p.simbolo}
                                </span>
                                <span className="flex-1 text-[0.9rem] text-gray-700 leading-relaxed" style={{ minWidth: '13rem' }}>
                                    {p.que}
                                </span>
                                {p.vale && (
                                    <span className="flex-shrink-0 text-[0.82rem] font-semibold rounded-lg px-2 py-1"
                                        style={{ background: '#FDF2F8', color: '#9D174D' }}>
                                        {p.vale}
                                    </span>
                                )}
                            </li>
                        ))}
                    </ul>
                    {nota && <p className="text-xs text-gray-500 italic" style={{ margin: '0.6rem 0 0' }}>{nota}</p>}
                </div>
            );
        };

        /* ============================================================
           TABLA DE RESULTADOS DE UN MODELO
           La salida de un `arch_model` o las métricas de un scorecard son
           el OBJETO DE ESTUDIO, no decoración. Una celda puede traer su
           lectura: `{ v: '0.089', lee: 'Reacción a la sorpresa de ayer…' }`.
           Las celdas con lectura se subrayan y, al pulsarlas, la muestran
           debajo. Se eligió un panel y no un tooltip porque las lecturas
           son de dos o tres líneas y un tooltip de ese tamaño es
           inutilizable en un teléfono.
        ============================================================ */
        const TablaResultados = ({ titulo, subtitulo, columnas, filas, nota }) => {
            const [activa, setActiva] = useState(null);
            const leeDe = (c) => (c && typeof c === 'object' && !React.isValidElement(c)) ? c : null;
            const valorDe = (c) => { const o = leeDe(c); return o ? o.v : c; };

            const sel = activa && filas[activa[0]] ? leeDe(filas[activa[0]].celdas[activa[1]]) : null;

            return (
                <div className="my-5">
                    {titulo && (
                        <div className="flex items-baseline gap-2 mb-2">
                            <i className="fas fa-table-list text-secondary"></i>
                            <span className="text-sm font-bold text-navy">{titulo}</span>
                            {subtitulo && <span className="text-xs text-gray-500 italic">{subtitulo}</span>}
                        </div>
                    )}
                    <div className="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
                        <table className="tabla-componente w-full text-sm bg-white" style={{ borderCollapse: 'collapse' }}>
                            <thead>
                                <tr style={{ background: '#001A4D' }}>
                                    {columnas.map((c, i) => (
                                        <th key={i} className="text-white text-left px-3 py-2 text-[0.78rem] font-semibold whitespace-nowrap">{c}</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {filas.map((f, i) => (
                                    <tr key={i} className={i % 2 ? 'bg-gray-50/60' : ''}>
                                        {f.celdas.map((c, j) => {
                                            const o = leeDe(c);
                                            const esta = activa && activa[0] === i && activa[1] === j;
                                            return (
                                                <td key={j} className="px-3 py-1.5 border-t border-gray-100 whitespace-nowrap"
                                                    style={{ fontFamily: j ? "'Fira Code', monospace" : undefined }}>
                                                    {o ? (
                                                        <button onClick={() => setActiva(esta ? null : [i, j])}
                                                            className={`text-left rounded px-1 -mx-1 transition-colors ${esta ? 'tr-gradient text-white' : 'text-primary hover:bg-primary/10'}`}
                                                            style={{ textDecoration: esta ? 'none' : 'underline dotted', textUnderlineOffset: '3px' }}>
                                                            {o.v}
                                                        </button>
                                                    ) : <span className="text-gray-700">{valorDe(c)}</span>}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {sel ? (
                        <div className="mt-2 rounded-xl border-l-4 px-3 py-2 animate-fade-in" style={{ borderColor: '#ED1E79', background: '#FDF2F8' }}>
                            <p className="text-[0.88rem] text-gray-700" style={{ margin: 0 }}>
                                <i className="fas fa-magnifying-glass-chart text-secondary mr-2"></i>{sel.lee}
                            </p>
                        </div>
                    ) : (
                        <p className="text-xs text-gray-400 italic mt-1.5" style={{ margin: '0.35rem 0 0' }}>
                            <i className="fas fa-hand-pointer mr-1"></i>Las cifras subrayadas explican qué dicen.
                        </p>
                    )}
                    {nota && <p className="text-xs text-gray-500 italic mt-1">{nota}</p>}
                </div>
            );
        };

        /* ============================================================
           R9 · LABORATORIO PARAMETRIZADO
           Deslizadores que recalculan la gráfica en el navegador. Es lo que
           justifica que el material sea HTML y no un PDF: mover α y ver
           moverse la cola enseña en tres segundos lo que un párrafo no.

           RESTRICCIÓN, y hay que respetarla: el cálculo ocurre aquí, en el
           navegador, así que `calcular` solo puede hacer ARITMÉTICA —un
           cuantil empírico, la recursión EWMA, la frontera de dos activos,
           la fórmula de Black-Scholes—. Ajustar un GARCH o resolver un
           programa cuadrático no cabe: eso se precomputa en Python sobre
           una malla de parámetros y se embebe; si algún control cae entre dos
           nodos, el deslizador interpola.
           `modo` declara cuál de los dos es, para que quien lea el código
           del capítulo no tenga que deducirlo.
        ============================================================ */
        const Laboratorio = ({ titulo = 'Laboratorio', enunciado, id, controles, calcular, lectura,
            altura = 'chart-h-360', modo = 'directo', nota, pregunta }) => {
            const inicial = () => Object.fromEntries(controles.map(c => [c.id, c.valor !== undefined ? c.valor : c.min]));
            const [p, setP] = useState(inicial);
            const [movido, setMovido] = useState(false);

            // La dependencia es el ESTADO SERIALIZADO, no `calcular`: el
            // capítulo la escribe como función en línea, así que su
            // identidad cambia en cada render y usarla como dependencia
            // redibujaría la gráfica sin parar.
            const firma = JSON.stringify(p);
            useEffect(() => {
                const el = document.getElementById(id);
                if (!el || !window.Plotly) return;
                const { traces, layout } = calcular(p);
                window.Plotly.react(id, traces, layout, { responsive: true, displayModeBar: false });
            }, [id, firma]);

            useEffect(() => () => {
                if (window.Plotly) { try { window.Plotly.purge(id); } catch (e) { } }
            }, [id]);

            const fijar = (cid, v) => { setMovido(true); setP(prev => ({ ...prev, [cid]: v })); };
            const reiniciar = () => { setMovido(false); setP(inicial()); };

            return (
                <div className="my-6 rounded-2xl border-2 p-5 shadow-sm" style={{ borderColor: '#DDD6FE', background: '#FBFAFF' }}>
                    <div className="flex items-center gap-2 mb-2">
                        <span className="text-white p-2 rounded-lg" style={{ background: 'linear-gradient(135deg,#7C3AED 0%,#3D008D 100%)' }}>
                            <i className="fas fa-sliders"></i>
                        </span>
                        <h4 className="text-base font-bold text-navy" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white rounded px-2 py-0.5" style={{ background: '#7C3AED' }}>R9 · Laboratorio</span>
                    </div>
                    {enunciado && <p className="text-[0.9rem] text-gray-700 mb-3" style={{ margin: '0 0 0.75rem' }}>{enunciado}</p>}

                    <div className="grid gap-3 mb-3" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(210px,1fr))' }}>
                        {controles.map(c => (
                            <label key={c.id} className="block">
                                <span className="flex items-baseline justify-between text-[0.78rem] font-semibold text-navy mb-1">
                                    <span>{c.etiqueta}</span>
                                    <span className="text-secondary" style={{ fontFamily: "'Fira Code', monospace" }}>
                                        {c.formato ? c.formato(p[c.id]) : p[c.id]}
                                    </span>
                                </span>
                                <input type="range" className="tr-range" min={c.min} max={c.max} step={c.paso}
                                    value={p[c.id]} aria-label={c.etiqueta}
                                    onChange={e => fijar(c.id, parseFloat(e.target.value))} />
                            </label>
                        ))}
                    </div>

                    <ChartFrame id={id} height={altura} />

                    {lectura && (
                        <div className="rounded-xl px-3 py-2 border-l-4" style={{ borderColor: '#7C3AED', background: '#F5F3FF' }}>
                            <p className="text-[0.88rem] text-gray-700" style={{ margin: 0 }}>
                                <i className="fas fa-eye text-purple-600 mr-2"></i>{lectura(p)}
                            </p>
                        </div>
                    )}

                    {pregunta && (
                        <p className="text-[0.88rem] text-gray-700 mt-3 font-medium" style={{ margin: '0.75rem 0 0' }}>
                            <i className="fas fa-circle-question text-secondary mr-2"></i>{pregunta}
                        </p>
                    )}

                    <div className="flex flex-wrap items-center gap-3 mt-3">
                        <button onClick={reiniciar} disabled={!movido}
                            className={`text-[0.72rem] font-semibold px-2.5 py-1 rounded-lg border transition-colors ${movido ? 'text-primary border-primary/40 hover:bg-primary/10' : 'text-gray-300 border-gray-200 cursor-default'}`}>
                            <i className="fas fa-rotate-left mr-1"></i>Valores iniciales
                        </button>
                        <span className="text-[0.68rem] text-gray-400 italic">
                            {/* «Interpola» era una afirmación de más: cuando los controles caen
                                siempre sobre un nodo —que es el caso de los laboratorios del curso—
                                no hay interpolación ninguna, y la nota del capítulo lo decía dos
                                líneas más abajo, contradiciendo a este texto fijo. */}
                            {modo === 'malla'
                                ? 'Los valores vienen de una malla precomputada en Python.'
                                : 'El cálculo se hace en el navegador con los mismos datos del capítulo.'}
                        </span>
                    </div>
                    {nota && <p className="text-xs text-gray-500 italic mt-2">{nota}</p>}
                </div>
            );
        };
        /* === TR-CORE FIN === */

        /* ============================================================
           CONFIGURACIÓN DEL CAPÍTULO
        ============================================================ */
        const CONFIG = {
            numero: '10',
            titulo: 'Duración, convexidad y valoración con QuantLib',
            subtitulo: 'Cuánto pierde el tramo de TES si las tasas suben, cómo se cubre, y por qué la respuesta depende de cómo se cuentan los días',
            unidad: 'U2 · Portafolio y renta fija',
            horas: 4,
            ra: 'RA5 · RA6',
            contenidoSyllabus: 'U2 · contenidos 4, 5 y 6 — Duración y convexidad; valoración con QuantLib; liquidez de financiación',
            temas: ['Duración', 'Convexidad', 'DV01 y cobertura', 'QuantLib', 'Convenciones del SEN', 'Verificación', 'LCR, NSFR y SARL'],
            nivelIA: 1,
            storageKey: 'tdr_cap10_duracion',
            docente: 'Javier Mauricio Sierra',
        };

        /* ============================================================
           DATOS DEL HILO CONDUCTOR
           El tramo de TES que el fondo sumó en el capítulo 9: tres bonos de
           estudio a 2, 5 y 10 años desde el 30/12/2025, con cupones de 6,00,
           7,75 y 7,25 % y 200 000 millones nominales cada uno, valorados con
           la curva del Banco leída en efectiva anual.

           Las cifras de abajo NO son un segundo cálculo: son las que imprimen
           los ocho bloques del capítulo, copiadas con sus decimales. Las
           gráficas y el laboratorio que recalculan algo lo hacen con la MISMA
           fórmula de los bloques, en el navegador.
        ============================================================ */
        const dec = (x, n = 2) => x.toFixed(n).replace('.', ',');
        const miles = (x) => Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        // Con signo menos tipográfico y sin «+»
        const num = (x, n = 2) => (x < 0 ? '−' : '') + dec(Math.abs(x), n);
        // Una diferencia en millones, con separador de miles y signo explícito
        const firmadoMiles = (x) => { const r = Math.round(x); return r === 0 ? '0' : (r < 0 ? '−' : '+') + miles(Math.abs(r)); };
        // Un número en millones con signo menos tipográfico y sin «+»
        const milesNum = (x) => (Math.round(x) < 0 ? '−' : '') + miles(Math.abs(x));

        const COL = { spot: '#3D008D', fwd: '#ED1E79', par: '#0E7490', gris: '#6B7280', ok: '#15803D', mal: '#B91C1C', am: '#B45309' };

        // Nelson-Siegel con τ fijo, como en el capítulo 9: las tres cargas de un plazo m…
        const cargasNS = (m, tau) => {
            const x = m / tau;
            if (x < 1e-9) return [1, 1, 0];
            const f = (1 - Math.exp(-x)) / x;
            return [1, f, f - Math.exp(-x)];
        };
        // …y el sistema 3×3 que ata los tres β a los tres vértices, por Cramer
        const resolver3 = (A, y) => {
            const det = (M) => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1])
                - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0])
                + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
            const d = det(A);
            return [0, 1, 2].map(k => det(A.map((fila, i) => fila.map((v, j) => (j === k ? y[i] : v)))) / d);
        };
        const TAU = 3.7;
        const VERT = [11.30, 12.84, 13.13];                // 1, 5 y 10 años el 30/12/2025, % efectivo anual
        const betasDe = (vert) => resolver3([1, 5, 10].map(m => cargasNS(m, TAU)), vert);
        const spotNS = (b, m) => { const c = cargasNS(m, TAU); return b[0] * c[0] + b[1] * c[1] + b[2] * c[2]; };
        const BETA = betasDe(VERT);

        // Los pagos de un bono con cupón anual, y su precio por cada 100
        const flujosBono = (T, c) => Array.from({ length: T }, (_, i) => (i < T - 1 ? c : c + 100));
        const precioTir = (y, T, c) => flujosBono(T, c).reduce((s, F, i) => s + F * Math.pow(1 + y, -(i + 1)), 0);
        const precioCurva = (b, T, c) => flujosBono(T, c).reduce((s, F, i) => s + F * Math.pow(1 + spotNS(b, i + 1) / 100, -(i + 1)), 0);

        const NOMINAL = 200000;                            // millones por bono

        // Bloque 1 · duración de Macaulay y modificada
        const BONOS = [
            { T: 2, c: 6.00, precio: 90.0388, tir: 11.8851, dmac: 1.9404, dmod: 1.7343, conv: 4.6027, valor: 180078 },
            { T: 5, c: 7.75, precio: 82.3327, tir: 12.7414, dmac: 4.2542, dmod: 3.7734, conv: 18.9761, valor: 164665 },
            { T: 10, c: 7.25, precio: 68.7718, tir: 13.0065, dmac: 6.8636, dmod: 6.0736, conv: 51.4612, valor: 137544 },
        ];
        const B1 = { total: 482287, dmodTramo: 3.6681, cero10: 8.8394, perdida100: [-3123, -6214, -8354], perdidaTramo: -17691 };

        // Bloque 2 · convexidad: [Δy en pb, exacto, primer orden, segundo orden, error 1, error 2]
        const APROX = [
            [-300, 58483, 53072, 58036, -5411, -447], [-200, 37716, 35381, 37587, -2335, -129],
            [-100, 18258, 17691, 18242, -567, -16], [-50, 8985, 8845, 8983, -140, -2],
            [50, -8709, -8845, -8707, -136, 2], [100, -17154, -17691, -17139, -537, 15],
            [200, -33291, -35381, -33175, -2090, 117], [300, -48492, -53072, -48107, -4580, 385],
        ];
        // Para recalcular en el navegador se usan las TIR del bloque con todos sus decimales: con las
        // de cuatro, el laboratorio se separaría un millón de la tabla de arriba en algunas filas
        const TIR_EXACTA = [0.1188512378, 0.1274140317, 0.1300654495];
        // Precio, duración modificada y convexidad a una sola tasa y, con las fórmulas de los bloques
        const medidas = (y, T, c) => {
            let p = 0, d = 0, cv = 0;
            flujosBono(T, c).forEach((F, i) => {
                const t = i + 1, v = F * Math.pow(1 + y, -t);
                p += v; d += t * v; cv += t * (t + 1) * v;
            });
            return { p, dmod: d / p / (1 + y), conv: cv / (p * Math.pow(1 + y, 2)) };
        };
        // El cambio exacto, de primer orden y de segundo orden, en millones, para un Δy en decimal
        const cambioBonos = (dy, cuales = [0, 1, 2]) => {
            let ex = 0, a1 = 0, a2 = 0;
            cuales.forEach(i => {
                const b = BONOS[i], y = TIR_EXACTA[i], m = medidas(y, b.T, b.c), v = m.p / 100 * NOMINAL;
                ex += (precioTir(y + dy, b.T, b.c) - m.p) / 100 * NOMINAL;
                a1 += -m.dmod * dy * v;
                a2 += (-m.dmod * dy + m.conv * dy * dy / 2) * v;
            });
            return { ex, a1, a2 };
        };

        // Bloque 3 · cambio de valor con +1 pb: [TIR, vértice 1, vértice 5, vértice 10, curva]
        const DV01 = {
            filas: [[-31.23, -18.36, -18.16, 5.30, -31.22], [-62.14, -3.74, -59.69, 1.44, -61.98], [-83.54, -2.63, -19.23, -61.14, -83.00]],
            tramo: [-176.91, -24.74, -97.07, -54.40, -176.21], cinco: 55.1,
        };

        // Bloque 4 · la cobertura con bonos a la par y su contraste con la historia
        const COB = {

                                porque: 'Derivar (1 + y)^(−t) baja el exponente: −t (1 + y)^(−t−1). Se saca 1/(1 + y) como factor común y queda cada pago descontado multiplicado por su plazo: los pagos lejanos pesan más en la pendiente, y por eso un bono largo es más sensible que uno corto.',

                        La duración es una recta, y el precio de un bono no lo es. La sección le añade el

                    <h3>La curva precio-TIR se dobla hacia arriba</h3>
                    <p>
                        La duración modificada es la pendiente de la curva precio-TIR en el punto de hoy, y una
                        recta solo coincide con una curva en ese punto. La de un bono de pagos fijos se dobla
                        hacia arriba —es <em>convexa</em>—: cuando la TIR sube, el precio cae cada vez menos, y
                        cuando baja, sube cada vez más. La recta tangente queda por debajo de la curva a los dos
                        lados, y por eso la duración exagera las pérdidas y se queda corta con las ganancias.

                    <Derivacion
                        titulo="Un término más de Taylor"
                        pasos={[
                            {
                                eq: <Eq>{'$$\\begin{aligned} P(y+\\Delta y) &\\approx P(y) + P\'(y)\\,\\Delta y \\\\ &\\quad + \\tfrac12\\,P\'\'(y)\\,(\\Delta y)^2 \\end{aligned}$$'}</Eq>,
                                porque: 'Taylor de segundo orden alrededor de la TIR de hoy. El término de la primera derivada es la duración de la sección 1; el de la segunda es el nuevo, y se multiplica por el cuadrado del cambio: con 10 pb casi no se ve, con 300 pb pesa nueve veces lo que con 100.',
                            },
                            {
                                eq: <Eq>{'$$P\'\'(y) = \\sum_{t=1}^{T} t\\,(t+1)\\,F_t\\,(1+y)^{-t-2}$$'}</Eq>,
                                porque: 'Derivar dos veces baja el exponente dos veces. Todos los términos son positivos —plazos, pagos y factores de descuento lo son—, así que la segunda derivada es positiva en cualquier bono de pagos fijos: su convexidad nunca es negativa.',
                            },
                            {
                                eq: <Eq>{'$$\\begin{gathered} C = \\frac{P\'\'(y)}{P} \\\\ \\frac{\\Delta P}{P} \\approx -D_{mod}\\,\\Delta y + \\tfrac12\\,C\\,(\\Delta y)^2 \\end{gathered}$$'}</Eq>,
                                porque: 'Dividiendo entre el precio, como con la duración. C se mide en años al cuadrado y crece con el cuadrado del plazo de los pagos: por eso la del bono de diez años, 51,46, es once veces la del de dos, 4,60, aunque su duración es apenas tres veces y media la de aquel.',
                            },
                        ]}
                        cierre="El término ½ C (Δy)² tiene el mismo signo suba o baje la tasa: siempre suma. Por eso, a igual duración, un bono más convexo pierde menos en las subidas y gana más en las bajadas, y el mercado lo paga. Un bono con opciones —uno que el emisor puede rescatar antes, o una cartera hipotecaria que se prepaga cuando las tasas bajan— puede tener convexidad negativa, y ahí la duración deja de ser pesimista. Los TES no tienen opciones."

                    <h3>El DV01: la duración en pesos</h3>
                    <p>
                        El{' '}
                        <Termino def="Del inglés dollar value of a basis point: lo que cambia el valor de una posición si la tasa sube un punto básico, en dinero. Para un bono, su duración modificada por su valor, dividido entre diez mil.">DV01</Termino>{' '}
                        (<em>dollar value of a basis point</em>, el valor de un punto básico) es lo que cambia el
                        valor de una posición si la tasa sube un punto básico, en pesos. Para un bono es la
                        duración modificada por el valor, dividida entre diez mil, y el del tramo es{' '}
                        <strong>{dec(-DV01.tramo[0], 2)} millones</strong>: cada punto básico que sube la TIR de
                        los tres bonos le cuesta al fondo casi 177 millones. A diferencia de la duración, que es
                        un porcentaje, el DV01 se suma entre posiciones de cualquier tamaño, y por eso una

                    <Eq>{'$$\\text{DV01} = \\frac{D_{mod}\\;V}{10\\,000}$$'}</Eq>

                    <p>
                        El problema es la palabra «la tasa». La duración mide el efecto de mover la TIR de cada

                        tasas cero un punto básico no mueve cada TIR exactamente un punto básico. La diferencia

                        <strong>el vértice de cinco años carga el {dec(DV01.cinco, 1)} % del riesgo del
                        tramo</strong> —{dec(-DV01.tramo[2], 2)} de {dec(-DV01.tramo[4], 2)} millones— aunque el
                        bono de cinco años es solo un tercio del nominal. Nelson-Siegel reparte la influencia de
                        ese vértice entre todos los plazos intermedios, y el bono de diez años le debe al
                        vértice de cinco casi un cuarto de su riesgo.
                    </p>

                    <Box type="warn" label="Un vértice que mueve el plazo que no le toca">
                        El bono de dos años <em>gana</em> {dec(DV01.filas[0][3], 2)} millones si sube solo el
                        vértice de diez años. No es un error del bloque: con τ fijo, subir un vértice sin mover
                        los otros dos obliga a la curva a doblarse, y la que pasa por 11,30 %, 12,84 % y 13,14 %
                        baja un poco a dos años. El riesgo por vértice es tanto del modelo de la curva como del
                        bono, y una cobertura que lo use hereda esa forma.
                    </Box>

                    <h3>La cobertura: igualar el DV01</h3>
                    <p>
                        Cubrir es tomar una posición cuyo DV01 sea igual y de signo contrario al del tramo. El
                        instrumento del capítulo es un bono a la par de la misma curva —el que cotiza en 100
                        con un cupón igual a la tasa par de su plazo, como en la sección 4 del capítulo 9—, que
                        el fondo vende: si las tasas suben, la venta gana lo que el tramo pierde. El nominal a
                        vender sale de dividir los dos DV01, y con tres instrumentos, uno por vértice, de
                        resolver un sistema de tres ecuaciones.
                    </p>

                    <Eq>{'$$N = \\frac{\\text{DV01}_{\\text{tramo}}}{\\text{DV01 por peso nominal de la cobertura}}$$'}</Eq>

                    <h3>Cuatro maneras de contar un año</h3>

                        monedas. <strong>Actual/365</strong> los divide entre 365. <strong>30/360</strong> supone

            { id: 'sec4', title: '4. QuantLib y las convenciones del TES', icon: 'Cpu', component: Seccion4 },
            { id: 'sec5', title: '5. Verificar el código y la curva', icon: 'Bug', component: Seccion5 },
            { id: 'sec6', title: '6. Liquidez de financiación', icon: 'Layers', component: Seccion6 },
            { id: 'eval', title: 'Evaluación', icon: 'HelpCircle', component: EvaluacionSection },
        ];


        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            // El `<head>` NO lo estampa `migrar.py`, así que un capítulo nacido
            // de copiar `tr-base.html` arrastra su título y su descripción sin
            // que nada avise: la pestaña del navegador dice «Plantilla base» y
            // eso es lo que ve quien tiene quince capítulos abiertos, y lo que
            // indexa GitHub Pages. Se derivan de `CONFIG`, que sí es lo primero
            // que cambia todo capítulo, para que ninguno pueda olvidarlo.
            useEffect(() => {
                document.title = `Cap. ${CONFIG.numero} · ${CONFIG.titulo} — Teoría del Riesgo`;
                const meta = document.querySelector('meta[name="description"]');
                if (meta) meta.setAttribute('content',
                    `${CONFIG.titulo}. ${CONFIG.subtitulo} · ${CONFIG.unidad} · `
                    + `Teoría del Riesgo, Universidad Santo Tomás.`);
            }, []);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 tr-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col tr-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `tr-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                Teoría del Riesgo
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg tr-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.unidad}</p>
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Python · R</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full tr-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white tr-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="prose-tr animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white tr-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="tr-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            Medir es fácil; defender el supuesto es el oficio.
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · Teoría del Riesgo
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            Material de aprendizaje autónomo. Casos contextualizados al mercado financiero colombiano.
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
